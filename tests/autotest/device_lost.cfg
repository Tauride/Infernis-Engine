# A lost device: debug_device_lost makes the engine behave as Direct3D 9 does when the
# device is lost (the screen is locked, the display mode changes, another program goes
# fullscreen): no frames for a while, then a device reset. Three times: in the main
# menu, while a level starts, and in the level. The FPS overlay is on, so its device
# objects are released and recreated as well. Look at the pictures: each must show the
# normal picture with the overlay. Run it with -Renderer r1, r2, r3 and r4.
# Needs no save.

wait_frames 60
rs_show_fps on

# In the main menu
debug_device_lost 30
wait_seconds 1
screenshot_overlay lost_menu
ui_expect btn_options

# While a level starts: the reset comes in the middle of loading
start server(all/single/alife/new) client(localhost)
debug_device_lost 5
wait_level 300
wait_seconds 3
screenshot_overlay lost_after_load

# In the level
debug_device_lost 30
wait_seconds 2
screenshot_overlay lost_level

rs_show_fps off
quit
