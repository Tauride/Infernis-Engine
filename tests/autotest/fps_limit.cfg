# The frame rate limit (rs_fps_limit) in the video options, with the mouse:
# - the dropdown is under the screen mode; it lists 30, 60, half, full and twice the
#   refresh rate without repeats, then "Unlimited" (read the ui_dump files for the
#   numbers: they depend on the display);
# - the choice is applied when the options are accepted: the main menu runs at that rate.
# The perf blocks measure the main menu at each limit: their fps should sit just under
# 30 and 60, at the refresh rate, and well above it when unlimited.
# run.ps1 starts every run with the limit off. Needs no save.

wait_frames 60
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept

ui_expect option:rs_fps_limit/st:fps_limit_unlimited
ui_dump fps_limit_opened

ui_click option:rs_fps_limit
ui_wait 2 option:rs_fps_limit/class:CUIListBox
ui_dump fps_limit_list
screenshot fps_limit_list
ui_click option:rs_fps_limit/class:CUIListBox/text:30
ui_expect option:rs_fps_limit/text:30
ui_click btn_accept
ui_wait 5 btn_options

wait_seconds 1
perf_begin limit_30
wait_seconds 4
perf_end

rs_fps_limit 60
wait_seconds 1
perf_begin limit_60
wait_seconds 4
perf_end

rs_fps_limit refresh
wait_seconds 1
perf_begin limit_refresh
wait_seconds 4
perf_end

rs_fps_limit off
wait_seconds 1
perf_begin unlimited
wait_seconds 4
perf_end
quit
