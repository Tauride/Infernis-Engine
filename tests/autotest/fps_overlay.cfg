# The FPS overlay (rs_show_fps): FPS, frame time and a graph of the last 30 seconds in
# the top right corner, drawn with Dear ImGui after everything else. screenshot_overlay
# takes the frame with the overlays; a plain screenshot is taken before them.
# The limit goes 60, 30, 60 so the graph shows steps and the color of the number
# follows the limit. Look at the pictures: fps_overlay_on has the overlay,
# fps_overlay_off and fps_overlay_plain do not. The overlay is off by default: the
# scenario turns it on and leaves it off. Needs no save.

wait_frames 60
rs_show_fps on
rs_fps_limit 60
wait_seconds 4
rs_fps_limit 30
wait_seconds 4
rs_fps_limit 60
wait_seconds 4
screenshot fps_overlay_plain
screenshot_overlay fps_overlay_on

# A device reset recreates the overlay's device objects
vid_restart
wait_seconds 2
screenshot_overlay fps_overlay_after_reset

rs_show_fps off
wait_frames 5
screenshot_overlay fps_overlay_off
quit
