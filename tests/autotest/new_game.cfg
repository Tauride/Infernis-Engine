# Smoke test: starts a new game from the main menu the way the menu does, checks the
# first level comes up, takes a screenshot, measures frame times while standing still,
# quits cleanly. Needs no save and writes none except the game's own autosave.

wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 5
screenshot new_game
perf_begin idle_20s
wait_seconds 20
perf_end
quit
