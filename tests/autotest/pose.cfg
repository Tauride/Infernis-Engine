# The pose step: puts the actor at a place and turns his camera, as an ask_pose step
# recorded them. Checks, at two poses, that the actor is there and the camera looks where
# the step said (the camera's direction has the opposite sign of both angles), and that it
# still does a few seconds later.
# ask_pose itself needs a person at the keyboard and is not covered here.

wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

lua function at_near(x, y, z) local p = db.actor:position() local d = p:distance_to(vector():set(x, y, z)) return d < 1.5, string.format("actor at %.2f %.2f %.2f, %.2f m off", p.x, p.y, p.z, d) end
lua function at_looks(yaw, pitch) local d = device().cam_dir return math.abs(d:getH() + yaw) < 0.01 and math.abs(d:getP() + pitch) < 0.01, string.format("camera h %.3f p %.3f", d:getH(), d:getP()) end

# Looking down to the right of the start
pose 256.24 19.81 550.82 1.000 0.500
wait_seconds 1
lua_expect at_near(256.24, 19.81, 550.82)
lua_expect at_looks(1.000, 0.500)
screenshot pose_down

# Two metres on, looking up the other way
pose 258.24 19.81 550.82 -2.000 -0.700
wait_seconds 1
lua_expect at_near(258.24, 19.81, 550.82)
lua_expect at_looks(-2.000, -0.700)
wait_seconds 3
lua_expect at_looks(-2.000, -0.700)
screenshot pose_up
quit
