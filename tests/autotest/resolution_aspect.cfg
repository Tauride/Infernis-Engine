# Accepting a resolution with another aspect ratio (16:9 to 4:3 and back). The main menu
# has a layout per aspect ratio, so the engine rebuilds it after the device reset; the
# options must come back with the "keep these settings?" box, and Yes must keep the
# resolution. Then the same in the other direction, answered No: the old one returns.
# The scenario sets 1280x720 first and ends on it.
# Needs no save.

wait_frames 60
vid_mode 1280x720
vid_restart
wait_seconds 1
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept

# 16:9 to 4:3, kept
ui_click option:vid_mode
ui_wait 2 option:vid_mode/class:CUIListBox
ui_click option:vid_mode/class:CUIListBox/text:1024x768
ui_click btn_accept
ui_wait 5 button_yes
screenshot aspect_4_3_confirm
ui_dump aspect_4_3_confirm
ui_click button_yes
ui_wait 5 btn_options
ui_expect_no button_yes
wait_seconds 1
screenshot aspect_4_3_kept

# 4:3 to 16:9, refused: the old resolution comes back
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept
ui_expect option:vid_mode/text:1024x768
ui_click option:vid_mode
ui_wait 2 option:vid_mode/class:CUIListBox
ui_click option:vid_mode/class:CUIListBox/text:1280x720
ui_click btn_accept
ui_wait 5 button_no
ui_click button_no
wait_seconds 2
ui_dump aspect_refused
screenshot aspect_refused

# Leave the run's settings as they were
vid_mode 1280x720
vid_restart
wait_seconds 1
quit
