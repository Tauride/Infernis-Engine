# The screen mode setting (rs_screenmode) in the video options, with the mouse:
# - "Borderless window" locks the resolution dropdown (the engine uses the display's
#   largest resolution for it); "Windowed" unlocks it again;
# - Cancel leaves the mode as it was;
# - accepting "Borderless window" resets the device and asks to keep the change; the
#   screenshot then has the display's size. Back to the window from the console.
# The resolutions depend on the display: read the ui_dump files for them.
# Exclusive fullscreen is left out: it would take over the screen.
# The game covers the whole display for a few seconds during this scenario.
# run.ps1 starts every run windowed. Needs no save.

wait_frames 60
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept

# The video tab is the first one
ui_expect option:rs_screenmode/st:screenmode_windowed
ui_dump screen_mode_opened

ui_click option:rs_screenmode
ui_wait 2 option:rs_screenmode/class:CUIListBox
screenshot screen_mode_list
ui_click option:rs_screenmode/class:CUIListBox/st:screenmode_borderless
ui_expect option:rs_screenmode/st:screenmode_borderless
ui_dump screen_mode_borderless
# The resolution is locked: a click doesn't open its list
ui_click option:vid_mode
wait_seconds 0.5
ui_expect_no option:vid_mode/class:CUIListBox

ui_click option:rs_screenmode
ui_wait 2 option:rs_screenmode/class:CUIListBox
ui_click option:rs_screenmode/class:CUIListBox/st:screenmode_windowed
ui_expect option:rs_screenmode/st:screenmode_windowed
# Unlocked again
ui_click option:vid_mode
ui_wait 2 option:vid_mode/class:CUIListBox
# The first click outside only closes the list
ui_click btn_cancel
ui_expect_no option:vid_mode/class:CUIListBox
ui_click btn_cancel
ui_wait 5 btn_options

# Cancel left the mode alone
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept
ui_expect option:rs_screenmode/st:screenmode_windowed

# Accept borderless: the device resets, and a message box asks to keep the change
ui_click option:rs_screenmode
ui_wait 2 option:rs_screenmode/class:CUIListBox
ui_click option:rs_screenmode/class:CUIListBox/st:screenmode_borderless
ui_click btn_accept
wait_log 10 *** RESET
ui_wait 5 button_yes
ui_click button_yes
# Keeping the change closes the options
ui_wait 5 btn_options
wait_seconds 2
log screen mode: borderless
screenshot borderless

# Back to a window from the console; switching picks the smallest resolution
rs_screenmode screenmode_windowed
vid_restart
wait_seconds 3
log screen mode: windowed
screenshot windowed

vid_mode 1280x720
vid_restart
wait_seconds 1
quit
