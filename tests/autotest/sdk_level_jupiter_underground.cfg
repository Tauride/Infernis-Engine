# Level editor port (stage 5): CoP's jupiter_underground, built by the Level Editor and compiled by Infernis's
# xrLC and xrAI, loads with ALife running. A new game starts on Zaton; the actor jumps to jupiter_underground through
# ALife (jump_to_level, needs -dev_mode); the level must come up with its objects online.
# Needs a game folder whose addon pack 20_level_compiler holds the compiled level (levels\jupiter_underground) and
# the spawn built with it (spawns\all.spawn); see the design notes
# (level-editor-port.md, stage 5). Run with -ExtraArgs "-dev_mode".

wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3
lua_expect level.name() == "zaton"

jump_to_level jupiter_underground
wait_seconds 10
wait_level 300
wait_seconds 5
lua_expect level.name() == "jupiter_underground"
lua_expect alife() ~= nil

# The level's ALife objects: the static ones come from the level's spawn (343 for CoP's jupiter_underground, also with
# the stock level), the dynamic ones (named section + id) are spawned at run time with random contents (about 260)
lua sdk_level = game_graph():vertex(db.actor:game_vertex_id()):level_id() sdk_static = 0 sdk_dynamic = 0 sdk_online = 0 for id = 0, 65534 do local o = alife():object(id) if o and game_graph():vertex(o.m_game_vertex_id):level_id() == sdk_level then if o:name() == o:section_name() .. o.id then sdk_dynamic = sdk_dynamic + 1 else sdk_static = sdk_static + 1 end if o.online then sdk_online = sdk_online + 1 end end end return string.format("objects on the level: %d static, %d dynamic, %d online", sdk_static, sdk_dynamic, sdk_online)
lua_expect sdk_static == 343
lua_expect sdk_online > 10

# Standing on the compiled geometry: the actor does not fall through the level
lua sdk_y = db.actor:position().y
wait_seconds 5
lua_expect math.abs(db.actor:position().y - sdk_y) < 1
screenshot sdk_jupiter_underground
perf_begin idle_10s
wait_seconds 10
perf_end
quit
