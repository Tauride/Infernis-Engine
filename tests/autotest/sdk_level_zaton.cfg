perf_begin details_off_3
wait_seconds 8
perf_end
lua get_console():execute("rs_detail on")

# Moving: the actor goes south from the start, 2 m every 3 frames over 200 m, on the AI map's ground (the grass
# around him is rebuilt as he moves), once with the grass and once without
lua sdk_start = db.actor:position() function sdk_step(i) local p = vector():set(sdk_start.x, sdk_start.y + 2, sdk_start.z - 2 * i) local v = level.vertex_id(p) if v < 4294967295 then db.actor:set_actor_position(level.vertex_position(v)) end end
