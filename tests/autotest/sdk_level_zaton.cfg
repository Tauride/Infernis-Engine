# Level editor port: CoP's Zaton, built by the Level Editor and compiled by Infernis's xrLC (-embree), xrDO_Light and
# xrAI. Zaton is the only CoP level in the test with detail objects (grass): the scenario checks that the level has
# level.details, that the grass is drawn, and the frame times with the grass on and off, looking in four directions
# from the start. A new game starts on Zaton.
# Needs a game folder whose addon pack 20_level_compiler holds the compiled level (levels\zaton) and the spawn built
# with it (spawns\all.spawn); without levels\zaton it runs on the stock level, as the baseline. See the design notes
# (level-editor-port.md, stage 5). Run with -ExtraArgs "-dev_mode".

fail_on_log Unknown command:  rs_detail
wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 5
lua_expect level.name() == "zaton"
lua_expect getFS():exist("$level$", "level.details") ~= nil

# The level's ALife objects, as in sdk_level_jupiter_underground.cfg: static ones from the level's spawn, dynamic
# ones (named section + id) spawned at run time
lua sdk_level = game_graph():vertex(db.actor:game_vertex_id()):level_id() sdk_static = 0 sdk_dynamic = 0 sdk_online = 0 for id = 0, 65534 do local o = alife():object(id) if o and game_graph():vertex(o.m_game_vertex_id):level_id() == sdk_level then if o:name() == o:section_name() .. o.id then sdk_dynamic = sdk_dynamic + 1 else sdk_static = sdk_static + 1 end if o.online then sdk_online = sdk_online + 1 end end end return string.format("objects on the level: %d static, %d dynamic, %d online", sdk_static, sdk_dynamic, sdk_online)
lua_expect sdk_online > 10

# Standing on the compiled geometry
lua sdk_y = db.actor:position().y return string.format("actor at %.2f %.2f %.2f", db.actor:position().x, sdk_y, db.actor:position().z)
wait_seconds 3
lua_expect math.abs(db.actor:position().y - sdk_y) < 1

# Four directions from the start, the grass on, then off. The actor is made invulnerable for the run, and the
# weather is fixed (a new game draws it at random; rain costs frame time of its own)
lua db.actor.health = 1 get_console():execute("g_god 1")
lua level.set_weather("default_clear", true)
# The statistics on: the perf results then carry the grass's own times (CStats' DT_Vis, DT_Render, DT_Cache)
lua get_console():execute("rs_stats on")
wait_seconds 2
lua sdk_dirs = {0, 1.5708, 3.1416, -1.5708}

lua db.actor:set_actor_direction(sdk_dirs[1])
wait_seconds 2
screenshot_overlay sdk_zaton_details_on_0
perf_begin details_on_0
wait_seconds 8
perf_end
lua db.actor:set_actor_direction(sdk_dirs[2])
wait_seconds 2
screenshot_overlay sdk_zaton_details_on_1
perf_begin details_on_1
wait_seconds 8
perf_end
lua db.actor:set_actor_direction(sdk_dirs[3])
