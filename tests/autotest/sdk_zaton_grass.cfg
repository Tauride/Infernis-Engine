# Grass on CoP's Zaton: the grass radius (r__detail_radius) and the grass in the sun's shadows (r2_sun_details),
# both after IX-Ray. A new game starts on Zaton; the view is the open field south of the start, in clear weather.
# Each setting gets a screenshot and frame times with the grass's own share (rs_stats: DT_Vis, DT_Render, DT_Cache).
# Needs the compiled Zaton (or the stock level) as sdk_level_zaton.cfg. Run with -ExtraArgs "-dev_mode".

fail_on_log Unknown command:  r__detail_radius
fail_on_log Unknown command:  r2_sun_details
fail_on_log Unknown command:  rs_detail
wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 5
lua_expect level.name() == "zaton"
lua db.actor.health = 1 get_console():execute("g_god 1")
lua level.set_weather("default_clear", true)
lua get_console():execute("rs_stats on")
lua get_console():execute("r2_sun_details off")
lua db.actor:set_actor_direction(3.1416)
wait_seconds 3

# The grass radius: GSC's 48 m, IX-Ray's default 120 m, and 250 m
lua get_console():execute("r__detail_radius 48")
wait_seconds 3
screenshot_overlay sdk_zaton_grass_r48
perf_begin radius_48
wait_seconds 6
perf_end
lua get_console():execute("r__detail_radius 120")
wait_seconds 5
screenshot_overlay sdk_zaton_grass_r120
perf_begin radius_120
wait_seconds 6
perf_end
lua get_console():execute("r__detail_radius 250")
wait_seconds 8
screenshot_overlay sdk_zaton_grass_r250
perf_begin radius_250
wait_seconds 6
perf_end
lua get_console():execute("rs_detail off")
wait_seconds 2
screenshot_overlay sdk_zaton_grass_none
perf_begin no_grass
wait_seconds 6
perf_end
lua get_console():execute("rs_detail on")

# The grass in the sun's shadows, at GSC's radius
lua get_console():execute("r__detail_radius 48")
wait_seconds 3
lua get_console():execute("r2_sun_details on")
wait_seconds 2
screenshot sdk_zaton_grass_shadows_on
perf_begin shadows_on
wait_seconds 6
perf_end
lua get_console():execute("r2_sun_details off")
wait_seconds 2
screenshot sdk_zaton_grass_shadows_off
perf_begin shadows_off
wait_seconds 6
perf_end

# Moving at 120 m: the larger cache refills as the actor goes south, 2 m every 3 frames over 100 m
lua get_console():execute("r__detail_radius 120")
lua sdk_start = db.actor:position() function sdk_step(i) local p = vector():set(sdk_start.x, sdk_start.y + 2, sdk_start.z - 2 * i) local v = level.vertex_id(p) if v < 4294967295 then db.actor:set_actor_position(level.vertex_position(v)) end end
