# Grass in the sun's shadows (r2_sun_details) on CoP's Zaton, by pictures: off and on in turn, half a second apart,
# so each "on" can be compared with the "off" before and after it (the light and the swaying grass drift).
# Run with -ExtraArgs "-dev_mode".

fail_on_log Unknown command:  r2_sun_details
wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 5
lua db.actor.health = 1 get_console():execute("g_god 1")
lua level.set_weather("default_clear", true)
lua db.actor:set_actor_direction(3.1416)
wait_seconds 3
lua get_console():execute("r2_sun_details off")
wait_seconds 0.5
screenshot sdk_grass_shadow_off_0
lua get_console():execute("r2_sun_details on")
wait_seconds 0.5
screenshot sdk_grass_shadow_on_0
lua get_console():execute("r2_sun_details off")
wait_seconds 0.5
