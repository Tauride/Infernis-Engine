# SoC port smoke test: starts a new game on the converted Cordon (l01_escape) with the
# actor and the scenery in the spawn and walks around: the level comes up in Sidorovich's
# bunker, then the actor is put at four places outdoors. In the village he walks from
# Wolf's post towards a point Wolf watches, and the scenario checks he got closer and
# stayed on the ground.
# Screenshots at each place, 20 s idle perf in the village, quits cleanly.
# Needs the "soc" spawn and the level from the SoC addon pack in the game folder (built
# by tools/level-convert in the design documentation repository).

# The FPS overlay is on and the frame rate is limited to 288, so the pictures show the
# frame times; both are put back at the end.
wait_frames 60
rs_show_fps on
rs_fps_limit 288
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 5
screenshot_overlay soc_cordon_bunker

# Newbie village: from Wolf's post (SoC patrol path esc_lager_wolf_walk, wp00) towards the
# farthest point he watches (esc_lager_wolf_look, wp05), about 25 m away
lua soc_from = vector():set(-199.87, -19.4, -137.11) soc_to = vector():set(-218.08, -20.61, -154.06)
lua db.actor:set_actor_position(soc_from)
lua db.actor:set_actor_direction(-vector():sub(soc_to, soc_from):getH())
wait_seconds 3
screenshot_overlay soc_cordon_village
ui_key_down forward
wait_seconds 4
ui_key_up forward
wait_seconds 1
lua soc_p = db.actor:position() return string.format("walked %.1f m, %.1f m closer to the look point, height %.1f", soc_p:distance_to_xz(soc_from), soc_from:distance_to_xz(soc_to) - soc_p:distance_to_xz(soc_to), soc_p.y)
lua_expect soc_from:distance_to_xz(soc_to) - soc_p:distance_to_xz(soc_to) > 5
lua_expect math.abs(soc_p.y - soc_to.y) < 2.5
screenshot_overlay soc_cordon_village_walked
perf_begin idle_20s
wait_seconds 20
perf_end

# The road by the railway bridge
lua db.actor:set_actor_position(vector():set(52.9, 2.3, 162.2))
wait_seconds 4
screenshot_overlay soc_cordon_bridge

# The north end
lua db.actor:set_actor_position(vector():set(25.9, 8.3, 616.3))
wait_seconds 4
screenshot_overlay soc_cordon_north

# The south end
lua db.actor:set_actor_position(vector():set(-151.1, -29.2, -387.0))
wait_seconds 4
lua return string.format("south end: height %.1f", db.actor:position().y)
lua_expect math.abs(db.actor:position().y + 29.7) < 3
screenshot_overlay soc_cordon_south
rs_show_fps off
rs_fps_limit off
wait_frames 5
quit
