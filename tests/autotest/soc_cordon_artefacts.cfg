# SoC port: the artefacts lying in the world of the converted Cordon (l01_escape). The "soc"
# spawn holds SoC's six (a Stone Blood, a Stone Flower, a Jellyfish, a Flash, two Sparklers)
# as the game's artefacts of the same names: the game's sections, models, effects and prices,
# nothing of SoC's but the places. A smoke test: all six are in the simulation, lying on no
# one, and every one comes online as an artefact of its section with the game's model when
# the actor is near.
# The actor is put at an artefact that has not been online yet, a few seconds pass, and every
# one that is online by then is ticked off; that is repeated until none is left. Six stops
# are the most it can take; there are eight.
# Not covered: where an artefact lies (the spawn places are taken as they are), whether it
# can be seen (the game hides an artefact until a detector shows it), picking up, effects.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# Every one is in the simulation. The counts are exact on purpose: update them when the
# converter starts to carry other objects of these sections
lua soc_want = {af_blood = 1, af_cristall_flower = 1, af_medusa = 1, af_electra_flash = 1, af_electra_sparkler = 2}
lua soc_items, soc_n, soc_total = {}, {}, 0 for i = 0, 65534 do local o = alife():object(i) if o and o.parent_id == 65535 and string.sub(o:section_name(), 1, 3) == "af_" then local s = o:section_name() soc_n[s] = (soc_n[s] or 0) + 1 soc_total = soc_total + 1 soc_items[#soc_items + 1] = {id = i, name = o:name(), section = s, position = vector():set(o.position)} end end local t = {} for s, n in pairs(soc_n) do t[#t + 1] = n .. " " .. s end table.sort(t) return soc_total .. " artefacts: " .. table.concat(t, ", ")
lua soc_bad = {} for s, n in pairs(soc_want) do if soc_n[s] ~= n then soc_bad[#soc_bad + 1] = s .. " " .. tostring(soc_n[s]) .. ", not " .. n end end return "wrong counts: " .. table.concat(soc_bad, "; ")
lua_expect #soc_bad == 0
lua_expect soc_total == 6

# The actor goes to the first artefact that has not been online; soc_tick ticks off the ones
# that are: there as an artefact of their section with the section's model (the game's),
# lying on no one
lua function soc_model(s) local v = string.gsub(system_ini():r_string(s, "visual"), "%.ogf$", "") return v end
lua function soc_go() for _, it in ipairs(soc_items) do if not it.seen then db.actor:set_actor_position(vector():set(it.position.x, it.position.y + 0.5, it.position.z)) return "to " .. it.name end end return "all seen, staying" end
lua function soc_tick() local seen = 0 for _, it in ipairs(soc_items) do local o = level.object_by_id(it.id) if o and o:section() == it.section and o:get_visual_name() == soc_model(it.section) and o:parent() == nil then it.seen = true end if it.seen then seen = seen + 1 end end return seen .. " of " .. #soc_items .. " have been online" end

lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()

# All of them have been online, and the trip did not kill the actor
lua soc_left = {} for _, it in ipairs(soc_items) do if not it.seen then soc_left[#soc_left + 1] = it.name end end return "never online: " .. table.concat(soc_left, ", ")
lua_expect #soc_left == 0
lua_expect db.actor:alive()
quit
