# SoC port: the inventory boxes of the converted Cordon (l01_escape). The "soc" spawn holds
# SoC's 25: 20 stashes (boxes with the treasure logic) and 5 plain boxes, all empty, on the
# game's inventory_box section with the game's models. A smoke test: all are in the
# simulation and every one comes online as an inventory box with a model the game has,
# empty, not closed, and letting its contents be taken. Then an item is put into one box
# and is in it.
# The actor is put at a box that has not been online yet, a few seconds pass, and every box
# that is online by then is ticked off; that is repeated until none is left. Eleven stops
# do it; there are sixteen.
# Not covered: opening a box by hand (the window), what SoC puts into a stash when it is
# revealed (the treasures are not converted), where a box stands.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# Every box is in the simulation; 20 of them have the treasure logic in their spawn data
lua soc_items, soc_logic = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o and o:section_name() == "inventory_box" then local ini = o:spawn_ini() if ini and ini:section_exist("logic") then soc_logic = soc_logic + 1 end soc_items[#soc_items + 1] = {id = i, name = o:name(), position = vector():set(o.position)} end end return #soc_items .. " inventory boxes, " .. soc_logic .. " with logic"
lua_expect #soc_items == 25
lua_expect soc_logic == 20

# The actor goes to the first box that has not been online; soc_tick ticks off the ones that
# are: there as an inventory box whose model is one of the game's cache models, empty, not
# closed, its contents free to take
lua function soc_go() for _, it in ipairs(soc_items) do if not it.seen then db.actor:set_actor_position(vector():set(it.position.x, it.position.y + 0.5, it.position.z)) return "to " .. it.name end end return "all seen, staying" end
lua function soc_box(o) return o:section() == "inventory_box" and o:clsid() == clsid.inventory_box_s and string.find(o:get_visual_name(), "dynamics\\equipment_cache\\", 1, true) == 1 and o:is_inv_box_empty() and not o:inv_box_closed_status() and o:inv_box_can_take_status() end
lua function soc_tick() local seen = 0 for _, it in ipairs(soc_items) do local o = level.object_by_id(it.id) if o and soc_box(o) then it.seen = true end if it.seen then seen = seen + 1 end end return seen .. " of " .. #soc_items .. " have been online" end

lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()
lua return soc_go()
wait_seconds 4
lua return soc_tick()

# All of them have been online
lua soc_left = {} for _, it in ipairs(soc_items) do if not it.seen then soc_left[#soc_left + 1] = it.name end end return "never online: " .. table.concat(soc_left, ", ")
lua_expect #soc_left == 0

# A box holds what is put into it: a loaf of bread created in the last box visited
lua for _, it in ipairs(soc_items) do if level.object_by_id(it.id) then soc_in = it end end soc_bread = alife():create("bread", soc_in.position, db.actor:level_vertex_id(), db.actor:game_vertex_id(), soc_in.id).id return "bread into " .. soc_in.name
wait_seconds 3
lua_expect alife():object(soc_bread) ~= nil and alife():object(soc_bread).parent_id == soc_in.id
lua_expect level.object_by_id(soc_in.id) ~= nil and not level.object_by_id(soc_in.id):is_inv_box_empty()
lua_expect db.actor:alive()
quit
