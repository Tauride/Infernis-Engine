# SoC port: the space restrictors of the trader's bunker on the converted Cordon (l01_escape):
# esc_space_restrictor, the room, which has no logic, and the eight with logic that lie inside
# it. Their logic is re-authored for the game's script framework (sr_idle, sr_no_weapon), with
# SoC's effects activate_bolt and run_pp_effector (SoC's run_postprocess) added to the game's
# xr_effects.script by the addon pack.
# Checked: all nine are in the simulation and online, inside esc_space_restrictor, the eight
# with their logic running; a new game starts in trader_zone with the weapon put away and in
# trader_zone_task, which fades the screen in and gives esc_kill_gunslinger once; at the
# trader's door (esc_bolt_zone) the actor is told to take a bolt, once, and has it in hand as
# soon as he is out of the no-weapon room; on the way out
# (esc_trader_sound_zone, esc_tutorial_trigger, esc_trader_extra_task_restr) the trader's
# greeting and farewell are reset, esc_tutorial_start is given, and trader_job only after
# esc_serious_talk; up the stairs (esc_close_door_restrictor) esc_close_door shuts the open
# trader's door; esc_anomaly_tips_zone leaves the tutorial on esc_heli_go; outside the bunker
# the hands are free again.
# Not covered: how the fade looks (pictures to look at); walking in (the actor is put in each
# zone); whoever gives these info portions in the game (the story is not converted).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
screenshot soc_cordon_bunker_fade_start
wait_seconds 4
screenshot soc_cordon_bunker_fade_end

# All nine are in the simulation and online
lua soc_names = {"esc_space_restrictor", "trader_zone", "trader_zone_task", "esc_anomaly_tips_zone", "esc_close_door_restrictor", "esc_trader_sound_zone", "esc_bolt_zone", "esc_tutorial_trigger", "esc_trader_extra_task_restr"}
lua soc_ids, soc_found = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o then for _, n in ipairs(soc_names) do if o:name() == n then soc_ids[n] = i soc_found = soc_found + 1 end end end end return soc_found .. " of " .. #soc_names .. " in the simulation"
lua_expect soc_found == 9
lua function soc_obj(n) return level.object_by_id(soc_ids[n]) end
lua function soc_sec(n) local st = db.storage[soc_ids[n]] return st and st.active_section end
lua soc_bad = {} for _, n in ipairs(soc_names) do if not soc_obj(n) then soc_bad[#soc_bad + 1] = n end end return "offline: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The eight lie inside the room, which has no logic
lua soc_bad = {} for i = 2, #soc_names do if not soc_obj("esc_space_restrictor"):inside(soc_obj(soc_names[i]):position()) then soc_bad[#soc_bad + 1] = soc_names[i] end end return "outside the room: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0
lua_expect soc_sec("esc_space_restrictor") == nil

# Their logic runs (trader_zone_task has already done its work and ended)
lua soc_secs = {} for i = 2, #soc_names do soc_secs[#soc_secs + 1] = soc_names[i] .. "=" .. tostring(soc_sec(soc_names[i])) end return table.concat(soc_secs, ", ")
lua_expect soc_sec("trader_zone") == "sr_no_weapon" and soc_sec("esc_anomaly_tips_zone") == "sr_idle@tutorial"
lua_expect soc_sec("esc_close_door_restrictor") == "sr_idle" and soc_sec("esc_trader_sound_zone") == "sr_idle" and soc_sec("esc_bolt_zone") == "sr_idle"
lua_expect soc_sec("esc_tutorial_trigger") == "sr_idle@start" and soc_sec("esc_trader_extra_task_restr") == "sr_idle@start"

# The new game starts in the room: the weapon is put away, the fade ran once
lua_expect soc_obj("esc_space_restrictor"):inside(db.actor:position())
lua_expect soc_obj("trader_zone"):inside(db.actor:center()) and bind_stalker.check_for_weapon_hide_by_zones()
lua_expect soc_obj("trader_zone_task"):inside(db.actor:position()) and has_alife_info("esc_kill_gunslinger") and soc_sec("trader_zone_task") == nil
lua_expect not has_alife_info("esc_close_door") and not has_alife_info("esc_tutorial_start") and not has_alife_info("trader_job")

# The trader's door is unlocked and opened (soc_cordon_scripted.cfg covers the door)
lua soc_door_id = nil for i = 0, 65534 do local o = alife():object(i) if o and o:name() == "trader_door" and level.object_by_id(i) then soc_door_id = i end end
lua function soc_door_sec() return db.storage[soc_door_id].active_section end
lua db.actor:give_info_portion("esc_trader_can_leave")
wait_seconds 1
lua db.storage[soc_door_id].ph_door.door_action:use_callback(level.object_by_id(soc_door_id), db.actor)
wait_seconds 2
lua_expect soc_door_sec() == "ph_door@open"

# The actor is put in a zone at its place on the level
lua function soc_go(n) local p = soc_obj(n):position() db.actor:set_actor_position(vector():set(p.x, p.y, p.z)) end

# At the trader's door, still in the no-weapon room: the actor is told to take a bolt (the
# engine keeps the slot while weapons are put away), and the zone ends
lua soc_go("esc_bolt_zone")
wait_seconds 2
lua_expect soc_obj("esc_bolt_zone"):inside(db.actor:position()) and soc_obj("trader_zone"):inside(db.actor:center())
lua return string.format("active slot %d; slot 6 holds %s", db.actor:active_slot(), tostring(db.actor:item_in_slot(6) and db.actor:item_in_slot(6):section()))
lua_expect soc_sec("esc_bolt_zone") == nil and db.actor:active_slot() ~= 6 and db.actor:item_in_slot(6) ~= nil

# On the way out: the greeting and the farewell are reset, the tutorial info is given, and no
# extra job without the serious talk
lua db.actor:give_info_portion("esc_trader_hello_played") db.actor:give_info_portion("esc_trader_bye_played")
lua soc_go("esc_trader_sound_zone")
wait_seconds 2
lua return "in: " .. tostring(soc_obj("esc_trader_sound_zone"):inside(db.actor:position())) .. " " .. tostring(soc_obj("esc_tutorial_trigger"):inside(db.actor:position())) .. " " .. tostring(soc_obj("esc_trader_extra_task_restr"):inside(db.actor:position()))
lua_expect not has_alife_info("esc_trader_hello_played") and not has_alife_info("esc_trader_bye_played")
lua_expect has_alife_info("esc_tutorial_start")
lua_expect not has_alife_info("trader_job")

# ... after the serious talk, the extra job
lua db.actor:give_info_portion("esc_serious_talk")
wait_seconds 1
lua_expect has_alife_info("trader_job")

# Outside the no-weapon room the hands are free again, and the bolt is in them
lua_expect not soc_obj("trader_zone"):inside(db.actor:center()) and not bind_stalker.check_for_weapon_hide_by_zones()
lua return string.format("active slot %d", db.actor:active_slot())
lua_expect db.actor:active_slot() == 6

# Up the stairs: esc_close_door, and the open door shuts
lua soc_go("esc_close_door_restrictor")
wait_seconds 2
lua_expect soc_obj("esc_close_door_restrictor"):inside(db.actor:position())
lua_expect has_alife_info("esc_close_door") and soc_door_sec() == "ph_door@closed"

# The tutorial ends on esc_heli_go
lua db.actor:give_info_portion("esc_heli_go")
wait_seconds 1
lua_expect soc_sec("esc_anomaly_tips_zone") == "sr_idle@peace"
quit
