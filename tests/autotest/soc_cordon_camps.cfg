# SoC port: the camp fires of the converted Cordon (l01_escape). A SoC camp fire is three
# objects in one place: a fire, a lamp that lights it (lights_camp_fire_omni_*) and a space
# restrictor that marks the place (camp_fire_*). In the "soc" spawn the fire is the game's
# campfire, the lamp is left out (the campfire gives its own light) and the restrictor is
# the game's camp: a camp_zone with a sphere of 5.8 m.
# Checked: no camp fire lamp is in the simulation; the 11 camps are camp_zone objects, each
# at a campfire; in the newbie village the camp is online with its camp manager running and
# its zone reaches 5.8 m and no further, and the campfire there burns. A picture of that
# fire at night shows whether it lights its place.
# Not covered: people at a camp (stories, guitar): the population is not converted.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# No lamp of a camp fire; 11 camps, all camp zones; 11 campfires
lua soc_lamps, soc_camps, soc_fires, soc_wrong = 0, {}, {}, {} for i = 0, 65534 do local o = alife():object(i) if o then local n, s = o:name(), o:section_name() if string.find(n, "lights_camp_fire_omni_", 1, true) == 1 then soc_lamps = soc_lamps + 1 end if string.find(n, "camp_fire_", 1, true) == 1 then soc_camps[#soc_camps + 1] = {id = i, name = n, position = vector():set(o.position)} if s ~= "camp_zone" then soc_wrong[#soc_wrong + 1] = n .. " is a " .. s end end if s == "campfire" then soc_fires[#soc_fires + 1] = vector():set(o.position) end end end return soc_lamps .. " lamps, " .. #soc_camps .. " camps, " .. #soc_fires .. " campfires; " .. table.concat(soc_wrong, ", ")
lua_expect soc_lamps == 0
lua_expect #soc_camps == 11
lua_expect #soc_wrong == 0
lua_expect #soc_fires == 11

# Every camp is at a campfire (within a metre)
lua soc_far = {} for _, c in ipairs(soc_camps) do local best = 1000 for _, f in ipairs(soc_fires) do best = math.min(best, c.position:distance_to(f)) end if best > 1 then soc_far[#soc_far + 1] = c.name end end return "camps with no campfire: " .. table.concat(soc_far, ", ")
lua_expect #soc_far == 0

# The newbie village: its camp comes online and its camp manager runs
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
wait_seconds 3
lua for _, c in ipairs(soc_camps) do if c.name == "camp_fire_0004" then soc_camp = c end end return "camp " .. tostring(soc_camp and soc_camp.name)
lua_expect soc_camp ~= nil and level.object_by_id(soc_camp.id) ~= nil
lua_expect level.object_by_id(soc_camp.id):section() == "camp_zone"
lua_expect bind_camp.camps[soc_camp.id] ~= nil and bind_camp.camps[soc_camp.id].camp ~= nil

# Its zone is a sphere of 5.8 m: a point 5.6 m from the centre is inside, one 6 m away is not
lua function soc_in(d) local p = soc_camp.position return level.object_by_id(soc_camp.id):inside(vector():set(p.x + d, p.y, p.z)) end
lua_expect soc_in(0)
lua_expect soc_in(5.6)
lua_expect not soc_in(6.0)

# The campfire there is online and burns
lua soc_fire = nil for i = 0, 65534 do local o = level.object_by_id(i) if o and o:section() == "campfire" and o:position():distance_to(soc_camp.position) < 1 then soc_fire = o end end return "campfire " .. tostring(soc_fire and soc_fire:name())
lua_expect soc_fire ~= nil
lua_expect soc_fire:get_campfire():is_on()

# The fire at midnight, from a few metres: the only light there is the campfire's
lua level.change_game_time(0, 24 - level.get_time_hours(), 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
lua level.set_weather(level.get_weather(), true) return "weather " .. level.get_weather()
lua db.actor:set_actor_direction(-vector():sub(soc_camp.position, db.actor:position()):getH())
wait_seconds 5
screenshot soc_camps_village_night

lua_expect db.actor:alive()
quit
