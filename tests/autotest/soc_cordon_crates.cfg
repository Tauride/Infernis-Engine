# SoC port: the loot crates of the converted Cordon (l01_escape). The "soc" spawn holds
# SoC's 54 breakable crates with a drop box: 27 with a fixed list of items, 13 that roll
# from a drop table and 14 empty ones. Checks that all are in the simulation, breaks the 11
# crates of the newbie village and counts what falls out: exactly the fixed lists, plus
# whatever the one rolling crate there gives (bandages, a medkit or pistol and rifle rounds).
# Then a crate with ammunition in its fixed list: it gives SoC's number of rounds.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# Every crate is in the simulation, among the level's other destroyable objects: 54 crates,
# 66 props and 7 scripted objects (soc_cordon_scripted.cfg)
lua soc_id, soc_dstr = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o then soc_id[o:name()] = i if o:section_name() == "physic_destroyable_object" then soc_dstr = soc_dstr + 1 end end end return soc_dstr .. " destroyable objects"
lua_expect soc_dstr == 127
lua soc_crates = {"esc_surprise_box_012", "esc_surprise_box_014", "esc_surprise_box_023", "esc_physic_destroyable_object_0071", "esc_surprise_box_028", "esc_surprise_box_013", "esc_physic_destroyable_object_0040", "esc_physic_destroyable_object_0041", "esc_physic_destroyable_object_0014", "esc_surprise_box_014_0000", "esc_surprise_box_022"}
lua soc_known = 0 for _, n in ipairs(soc_crates) do if soc_id[n] then soc_known = soc_known + 1 end end return soc_known .. " village crates in the simulation"
lua_expect soc_known == 11

# The village: its crates are online
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
wait_seconds 4
lua soc_online = 0 for _, n in ipairs(soc_crates) do if level.object_by_id(soc_id[n]) then soc_online = soc_online + 1 end end return soc_online .. " village crates online"
lua_expect soc_online == 11

# Items lying in the world (not in anyone's inventory), by section, before and after
lua function soc_loose() local t = {} for i = 0, 65534 do local o = alife():object(i) if o and o.parent_id == 65535 then local s = o:section_name() t[s] = (t[s] or 0) + 1 end end return t end
lua soc_before = soc_loose()
lua for _, n in ipairs(soc_crates) do local h = hit() h.type = hit.strike h.power = 1000 h.impulse = 200 h.direction = vector():set(0, -1, 0) h.draftsman = db.actor level.object_by_id(soc_id[n]):hit(h) end
wait_seconds 3
lua soc_after = soc_loose()
lua function soc_new(s) return (soc_after[s] or 0) - (soc_before[s] or 0) end
lua local t = {} for s, n in pairs(soc_after) do if soc_new(s) ~= 0 and s ~= "physic_destroyable_object" then t[#t + 1] = soc_new(s) .. " " .. s end end table.sort(t) return "out of the crates: " .. table.concat(t, ", ")

# The fixed lists: af_blood; vodka, 1, energy_drink, 2; conserva, 2; antirad, 1, bandage, 3;
# conserva, 4; bandage, 2; af_cristall_flower; killer_outfit; medkit
lua_expect soc_new("af_blood") == 1
lua_expect soc_new("af_cristall_flower") == 1
lua_expect soc_new("vodka") == 1
lua_expect soc_new("energy_drink") == 2
lua_expect soc_new("conserva") == 6
lua_expect soc_new("antirad") == 1
lua_expect soc_new("killer_outfit") == 1
# The rolling crate (small_box_ussr) can add bandages and a medkit to the fixed 5 and 1
lua_expect soc_new("bandage") >= 5 and soc_new("bandage") <= 7
lua_expect soc_new("medkit") >= 1 and soc_new("medkit") <= 3
# and nothing a Cordon crate cannot hold
lua soc_odd = {} local ok = {af_blood = 1, af_cristall_flower = 1, vodka = 1, energy_drink = 1, conserva = 1, antirad = 1, killer_outfit = 1, bandage = 1, medkit = 1, ["ammo_9x18_fmj"] = 1, ["ammo_9x18_pmm"] = 1, ["ammo_5.45x39_fmj"] = 1, ["ammo_5.45x39_ap"] = 1, physic_destroyable_object = 1} for s in pairs(soc_after) do if soc_new(s) > 0 and not ok[s] then soc_odd[#soc_odd + 1] = s end end return "unexpected: " .. table.concat(soc_odd, ", ")
lua_expect #soc_odd == 0

# Ammunition in a fixed list: SoC counts it in boxes and packs 20 pistol rounds a box, this
# game 50. The crate esc_surprise_box_013_0000 holds "ammo_9x18_fmj, 20", 400 rounds in
# SoC; here that is 8 boxes of 50, not 20
lua db.actor:set_actor_position(vector():set(-206.3, -35.3, -274.9))
wait_seconds 4
lua_expect level.object_by_id(soc_id["esc_surprise_box_013_0000"]) ~= nil
lua soc_before = soc_loose()
lua local h = hit() h.type = hit.strike h.power = 1000 h.impulse = 200 h.direction = vector():set(0, -1, 0) h.draftsman = db.actor level.object_by_id(soc_id["esc_surprise_box_013_0000"]):hit(h)
wait_seconds 3
lua soc_after = soc_loose() return soc_new("ammo_9x18_fmj") .. " boxes of 9x18 out of the crate"
lua_expect soc_new("ammo_9x18_fmj") == 8
lua local p = db.actor:position() return string.format("actor at %.1f %.1f %.1f", p.x, p.y, p.z)

# One of the village crates, broken, with its loot
lua db.actor:set_actor_position(vector():set(-170.89, -20.01, -134.64))
lua db.actor:set_actor_direction(-vector():sub(vector():set(-175.8, -19.2, -133.4), db.actor:position()):getH())
wait_seconds 3
screenshot soc_crates_broken
quit
