# SoC port: the tutorial flesh of the converted Cordon (l01_escape), SoC's
# esc_suicidal_flesh, and the scene it plays. The flesh grazes in the bushes below the
# village; when the actor comes near (into esc_suicidal_flash_restrictor) it runs in panic
# into the mincer, is killed in esc_flesh_destroy, and the actor gets the trader's tip about
# anomalies: the text on the PDA and the trader's voice. The logic is re-authored for the
# game's script framework (mob_walker, mob_death, hit_npc, sr_idle with send_tip).
# Checked: the flesh, its two zones and its patrol paths are in the game, the flesh is online
# under its story id with its logic running and stays in the bushes while the actor is
# away; with the actor near it starts (tutorial_flesh_start), runs, dies inside
# esc_flesh_destroy (tutorial_flesh_die; dead as the game object, the server object and the
# death callback see it), and the tip follows once
# (tips_esc_trader_about_anomalies) with the trader's words playing for the actor.
# Screenshots: the flesh starting its run, and the tip on the screen.
# Not covered: the start by a hit (mob_was_hit), the flesh killed elsewhere, and whether the
# tip's text and voice are seen and heard as they should (only that they are sent).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 4

# The flesh, under its story id, online with its logic in the bushes section
lua soc_id = get_story_object_id("esc_tutorial_flesh") return "flesh id " .. tostring(soc_id)
lua_expect soc_id ~= nil and alife():object(soc_id):name() == "esc_suicidal_flesh"
lua function soc_flesh() return level.object_by_id(soc_id) end
lua function soc_sec() local st = db.storage[soc_id] return st and st.active_section end
lua_expect soc_flesh() ~= nil and soc_flesh():alive()
lua_expect soc_flesh():get_visual_name() == "monsters\\flesh\\flesh"
lua_expect soc_sec() == "mob_walker@bush"

# Its zones are online, the big one with its logic waiting; its patrol paths are there
lua soc_zone = db.zone_by_name["esc_suicidal_flash_restrictor"] soc_destroy = db.zone_by_name["esc_flesh_destroy"]
lua_expect soc_zone ~= nil and soc_destroy ~= nil
lua_expect db.storage[soc_zone:id()].active_section == "sr_idle@wait"
lua soc_bad = {} for _, n in ipairs({"esc_tut_flesh_bush_walk", "esc_tut_flesh_bush_look", "esc_tut_flesh_anomaly_walk", "esc_tut_flesh_anomaly_look", "esc_hit_point"}) do if not level.patrol_path_exists(n) then soc_bad[#soc_bad + 1] = n end end return "missing paths: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# From here on what happens is noted every frame with the second it was first seen in
lua soc_seen, soc_t0, soc_in_destroy, soc_voice = {}, time_global(), false, false
lua function soc_note(what) if not soc_seen[what] then soc_seen[what] = math.floor((time_global() - soc_t0) / 100) / 10 end end
lua level.add_call(function() local f = soc_flesh() if f then if soc_sec() then soc_note(soc_sec()) end if not f:alive() then soc_note("dead") soc_dead_at = soc_dead_at or vector():set(f:position()) elseif soc_destroy:inside(f:position()) then soc_in_destroy = true end end for _, i in ipairs({"tutorial_flesh_start", "tutorial_flesh_die", "tips_esc_trader_about_anomalies"}) do if has_alife_info(i) then soc_note(i) end end local s = xr_sound.sound_table[db.actor:id()] if s and s.path and string.find(s.path, "trader_tutorial_anomalies", 1, true) then soc_voice = true end return false end, function() end)
lua function soc_report() local t = {} for s, at in pairs(soc_seen) do t[#t + 1] = s .. " at " .. at .. " s" end table.sort(t) return table.concat(t, ", ") end

# With the actor away (he starts in the trader's bunker) it stays in the bushes
lua return "actor " .. db.actor:position():distance_to(soc_flesh():position()) .. " m from the flesh"
lua_expect not soc_zone:inside(db.actor:position())
wait_seconds 5
lua_expect soc_sec() == "mob_walker@bush" and soc_flesh():alive()
lua_expect not has_alife_info("tutorial_flesh_start")
lua soc_from = soc_flesh():position() return "flesh at " .. soc_from.x .. ", " .. soc_from.y .. ", " .. soc_from.z
lua_expect soc_from:distance_to(vector():set(-267.96, -10.97, -69.33)) < 10

# The actor comes near: into the zone, about 25 m from the anomalies, looking at the flesh
lua soc_at = level.vertex_position(level.vertex_id(vector():set(-250.0, -8.0, -76.0))) db.actor:set_actor_position(soc_at) db.actor:set_actor_direction(-vector():sub(soc_from, soc_at):getH()) return "actor at " .. soc_at.x .. ", " .. soc_at.y .. ", " .. soc_at.z
wait_seconds 1
lua_expect soc_zone:inside(db.actor:position())
lua return soc_report()
lua_expect has_alife_info("tutorial_flesh_start")
lua_expect soc_seen["mob_walker@anomaly"] ~= nil
screenshot soc_flesh_run

# It runs into the mincer and is killed inside esc_flesh_destroy; the tip follows (about
# 5 s after the actor came near) and shows for 5 s
wait_seconds 6
screenshot soc_flesh_tip
wait_seconds 10
lua return soc_report()
lua_expect soc_seen["dead"] ~= nil
lua_expect soc_in_destroy
lua return "died at " .. soc_dead_at.x .. ", " .. soc_dead_at.y .. ", " .. soc_dead_at.z .. ", " .. soc_dead_at:distance_to(vector():set(-260.28, -8.74, -48.89)) .. " m from the middle of esc_flesh_destroy"
lua_expect has_alife_info("tutorial_flesh_die")
lua_expect has_alife_info("tips_esc_trader_about_anomalies")
lua_expect soc_seen["tips_esc_trader_about_anomalies"] >= soc_seen["tutorial_flesh_die"]
lua_expect soc_voice
lua_expect db.storage[soc_zone:id()].active_section == nil or db.storage[soc_zone:id()].active_section == "nil"

# The death, as the engine has it: the game object and the server object are dead, and the
# death callback ran (mob_death keeps who killed it)
lua local f = soc_flesh() return "health " .. tostring(f and f.health) .. ", killer " .. tostring(db.storage[soc_id].death and db.storage[soc_id].death.killer_name)
lua_expect soc_flesh() ~= nil and not soc_flesh():alive()
lua_expect soc_flesh().health <= 0
lua_expect not alife():object(soc_id):alive()
lua_expect db.storage[soc_id].death ~= nil and db.storage[soc_id].death.killer ~= nil

lua_expect db.actor:alive()
quit
