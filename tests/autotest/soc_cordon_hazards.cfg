# SoC port: the hazards of the converted Cordon (l01_escape). The "soc" spawn holds the 184
# objects the spawn map files under Hazards: springboards, whirligigs, electro, radiation,
# the minefield, fires and explosive barrels. Their sections are derived from CoP's
# anomalies (configs\zones\zone_soc.ltx in the SoC addon pack); fires are CoP campfires.
# Checks that they are all in the simulation and come online near the actor, walks the
# actor into one of each kind and blows up a barrel. The actor is invulnerable (g_god) and
# must end the run unhurt.
# What is asserted: the counts, that the objects are online, that a barrel is gone and the
# actor's health. That a springboard, a whirligig or a mine does something is only in the
# pictures; electro and radiation show nothing there with g_god on.
# Run with -ExtraArgs "-dev_mode": g_god is a developer command.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
g_god on
wait_seconds 3

# Every hazard is in the simulation. The counts are exact on purpose: update them when the
# converter starts to carry other objects of these sections
lua soc_n, soc_id = {}, {} for i = 0, 65534 do local o = alife():object(i) if o then local s = o:section_name() soc_n[s] = (soc_n[s] or 0) + 1 soc_id[o:name()] = i end end
lua_expect soc_n.zone_mosquito_bald_weak == 85
lua_expect soc_n.zone_mosquito_bald_weak_noart == 2
lua_expect soc_n.zone_mincer_weak_noart == 4
lua_expect soc_n.zone_witches_galantine == 9
lua_expect soc_n.zone_radioactive_killing == 17
lua_expect soc_n.zone_radioactive_average == 1
lua_expect soc_n.zone_mine_field_soc == 49
lua_expect soc_n.campfire == 11
lua_expect soc_n.explosive_barrel == 4
lua_expect soc_n.explosive_mobiltank == 2

lua function soc_online(name) return soc_id[name] ~= nil and level.object_by_id(soc_id[name]) ~= nil end
lua function soc_look(x, y, z) db.actor:set_actor_direction(-vector():sub(vector():set(x, y, z), db.actor:position()):getH()) end
lua function soc_put(x, y, z) db.actor:set_actor_position(vector():set(x, y, z)) end
lua function soc_state() return string.format("health %.2f, radiation %.2f, at %.1f %.1f %.1f", db.actor.health, db.actor.radiation, db.actor:position().x, db.actor:position().y, db.actor:position().z) end

# Springboard (the tutorial one north of the village): seen from outside, then entered
lua soc_put(-264.5, -7.5, -42.9)
lua soc_look(-271.8, -7.7, -42.9)
wait_seconds 3
lua_expect soc_online("esc_tutorial_mosquito_bald_01")
screenshot soc_hazards_springboard
lua soc_put(-271.8, -7.2, -42.9)
wait_seconds 1
screenshot soc_hazards_springboard_inside
wait_seconds 2
lua return "springboard: " .. soc_state()

# Whirligig (the tutorial one)
lua soc_put(-259.5, -8.5, -35.9)
lua soc_look(-267.2, -8.9, -35.9)
wait_seconds 3
lua_expect soc_online("esc_tutorial_mincer_01")
screenshot soc_hazards_whirligig
lua soc_put(-267.2, -8.4, -35.9)
wait_seconds 1
screenshot soc_hazards_whirligig_inside
wait_seconds 3
lua return "whirligig: " .. soc_state()

# Electro in the tunnel under the railway embankment
lua soc_put(-78.4, -0.8, 118.0)
lua soc_look(-78.4, -1.3, 126.6)
wait_seconds 3
lua_expect soc_online("esc_zone_witches_galantine")
screenshot soc_hazards_electro
lua soc_put(-78.4, -0.8, 126.6)
wait_seconds 1
screenshot soc_hazards_electro_inside
wait_seconds 2
lua return "electro: " .. soc_state()

# Deadly radiation
lua soc_put(253.4, 20.7, 222.0)
wait_seconds 4
lua_expect soc_online("esc_zone_radioactive_killing")
screenshot soc_hazards_radiation
lua return "radiation: " .. soc_state()

# Minefield at the south checkpoint: the actor walks onto a mine
lua soc_put(-103.0, -29.5, -267.0)
lua soc_look(-103.0, -30.0, -273.0)
wait_seconds 3
lua_expect soc_online("esc_zone_mine_field")
screenshot soc_hazards_mine_before
ui_key_down forward
wait_seconds 1.5
ui_key_up forward
screenshot soc_hazards_mine_0
wait_seconds 0.4
screenshot soc_hazards_mine_1
wait_seconds 0.6
screenshot soc_hazards_mine_2
lua return string.format("mine: %.1f m from it, ", db.actor:position():distance_to_xz(vector():set(-103.0, 0, -273.0))) .. soc_state()
# He walked onto the mine
lua_expect db.actor:position():distance_to_xz(vector():set(-103.0, 0, -273.0)) < 1.5

# A fire: CoP's campfire, burning
lua soc_put(62.9, 0.3, 144.3)
lua soc_look(62.9, -0.2, 149.3)
wait_seconds 3
lua_expect soc_online("zone_flame_small_0002")
lua_expect level.object_by_id(soc_id["zone_flame_small_0002"]):get_campfire():is_on()
screenshot soc_hazards_fire

# Explosive barrels at the south checkpoint: the actor shoots them
lua function soc_barrels() local n = 0 for i = 0, 65534 do local o = alife():object(i) if o and o:section_name() == "explosive_barrel" then n = n + 1 end end return n end
lua soc_put(-134.2, -29.7, -345.0)
lua soc_look(-134.2, -30.2, -351.2)
wait_seconds 3
lua_expect soc_online("explosive_barrel")
lua_expect soc_online("explosive_barrel0000")
screenshot soc_hazards_barrels
lua db.actor:actor_look_at_point(vector():set(-134.2, -29.75, -351.2))
wait_seconds 1
screenshot soc_hazards_barrels_aim
# Short bursts, aimed again each time: recoil lifts the camera
lua db.actor:actor_look_at_point(vector():set(-134.2, -29.75, -351.2))
wait_seconds 0.3
ui_key_down wpn_fire
wait_seconds 0.25
ui_key_up wpn_fire
wait_seconds 0.5
lua db.actor:actor_look_at_point(vector():set(-134.2, -29.75, -351.2))
wait_seconds 0.3
ui_key_down wpn_fire
wait_seconds 0.25
ui_key_up wpn_fire
wait_seconds 0.5
lua db.actor:actor_look_at_point(vector():set(-134.2, -29.75, -351.2))
wait_seconds 0.3
ui_key_down wpn_fire
wait_seconds 0.25
ui_key_up wpn_fire
wait_seconds 0.5
lua db.actor:actor_look_at_point(vector():set(-134.2, -29.75, -351.2))
wait_seconds 0.3
ui_key_down wpn_fire
wait_seconds 0.25
ui_key_up wpn_fire
wait_seconds 0.3
screenshot soc_hazards_barrels_explosion
wait_seconds 4
lua return soc_barrels() .. " of 4 barrels left"
lua_expect soc_barrels() < 4
screenshot soc_hazards_barrels_after

# Invulnerable all the way
lua return "end: " .. soc_state()
lua_expect db.actor:alive() and db.actor.health > 0.99
g_god off
quit
