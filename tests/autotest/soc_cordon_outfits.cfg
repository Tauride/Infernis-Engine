# SoC port: the three outfits of SoC's Cordon crates that Call of Pripyat lacks
# (bandit_outfit, killer_outfit, soldier_outfit), recreated by the SoC addon pack. Gives
# them to the actor, checks their names and icons in the inventory, puts each on with a
# double click and checks the body model it gives, looks at the actor from outside, and
# drops two of them into the world.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# The sections exist and have their own names (an id without a text comes back as itself)
lua_expect system_ini():section_exist("bandit_outfit") and system_ini():section_exist("killer_outfit") and system_ini():section_exist("soldier_outfit")
lua_expect game.translate_string("bandit_outfit_name") ~= "bandit_outfit_name"
lua_expect game.translate_string("killer_outfit_description") ~= "killer_outfit_description"
lua_expect game.translate_string("outfit_soldier_name") ~= "outfit_soldier_name"

# Into the open, then the outfits into the actor's inventory
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
lua for _, s in ipairs({"bandit_outfit", "killer_outfit", "soldier_outfit"}) do alife():create(s, db.actor:position(), db.actor:level_vertex_id(), db.actor:game_vertex_id(), db.actor:id()) end
wait_seconds 2
lua_expect db.actor:object("bandit_outfit") ~= nil and db.actor:object("killer_outfit") ~= nil and db.actor:object("soldier_outfit") ~= nil

ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 1
ui_expect item:bandit_outfit
ui_expect item:killer_outfit
ui_expect item:soldier_outfit
ui_dump soc_outfits
screenshot soc_outfits_inventory

# Each one is put on with a double click and gives the actor its body model. Putting an
# outfit on closes the inventory (the actor changes clothes), so it is opened again
# once the change is over (about 5 s)
lua function soc_worn() local o = db.actor:get_current_outfit() return o and o:section() or "none" end
ui_dblclick item:bandit_outfit
wait_seconds 7
lua return soc_worn() .. ", " .. db.actor:get_visual_name()
lua_expect soc_worn() == "bandit_outfit"
lua_expect string.find(db.actor:get_visual_name(), "stalker_bandit_3", 1, true) ~= nil
screenshot soc_outfits_bandit_worn

ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 1
ui_dblclick item:soldier_outfit
wait_seconds 7
lua_expect soc_worn() == "soldier_outfit"
lua_expect string.find(db.actor:get_visual_name(), "stalker_soldier_1", 1, true) ~= nil

ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 1
ui_dblclick item:killer_outfit
wait_seconds 7
lua_expect soc_worn() == "killer_outfit"
lua_expect string.find(db.actor:get_visual_name(), "stalker_merc_2", 1, true) ~= nil
ui_expect_no class:CUIActorMenu
screenshot soc_outfits_killer_worn

# The actor from outside, in the merc suit, then back to the first person. The camera
# actions have no keys in the autotest settings; they get two free keys for these steps
bind cam_1 kF10
bind cam_2 kF11
ui_key kF11
wait_seconds 2
screenshot soc_outfits_killer_body
ui_key kF10
wait_seconds 1
unbind cam_1
unbind cam_2

# On the ground: the two that are not worn become objects in the world with their item
# models (checked as present only)
lua db.actor:drop_item(db.actor:object("bandit_outfit")) db.actor:drop_item(db.actor:object("soldier_outfit"))
wait_seconds 3
lua soc_drop = 0 for i = 0, 65534 do local o = level.object_by_id(i) if o and (o:section() == "bandit_outfit" or o:section() == "soldier_outfit") and o:parent() == nil then soc_drop = soc_drop + 1 end end return soc_drop .. " outfits on the ground"
lua_expect soc_drop == 2
quit
