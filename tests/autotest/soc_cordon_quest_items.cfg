# SoC port: the quest item of the converted Cordon (l01_escape), quest_case_01, the documents
# from the army outpost. Call of Pripyat has no such item; the SoC addon pack recreates it
# the way the game makes its own quest items (a section derived from the PDA) with SoC's
# model, icon and texts, and carries the one lying on Cordon into the "soc" spawn.
# Checks the section and its texts, that the one in the spawn is in the simulation on no one
# and comes online near the actor with its section's model (SoC's), and that a second one
# given to the actor shows in the inventory with its icon.
# Not covered: the quest that asks for it (not converted yet), picking it up by hand.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# The section: a quest item, not for trade, with its own name and description
lua_expect system_ini():section_exist("quest_case_01")
lua_expect system_ini():r_bool("quest_case_01", "quest_item") and not system_ini():r_bool("quest_case_01", "can_trade")
lua_expect game.translate_string("item_case_esc_name") ~= "item_case_esc_name"
lua_expect game.translate_string("item_case_esc_desc") ~= "item_case_esc_desc"

# The one SoC places on Cordon is in the simulation, on no one
lua soc_n = 0 for i = 0, 65534 do local o = alife():object(i) if o and o:section_name() == "quest_case_01" and o.parent_id == 65535 then soc_n = soc_n + 1 soc_case = i soc_name = o:name() end end return soc_n .. " quest_case_01 lying in the world" .. (soc_name and (": " .. soc_name) or "")
lua_expect soc_n == 1

# Near the actor it is online, a quest_case_01 with SoC's model. Its place is taken as it is
lua local q = alife():object(soc_case).position db.actor:set_actor_position(vector():set(q.x, q.y + 0.5, q.z))
wait_seconds 5
lua local o = level.object_by_id(soc_case) return o and (o:section() .. ", model " .. o:get_visual_name()) or "offline"
lua_expect level.object_by_id(soc_case) ~= nil and level.object_by_id(soc_case):section() == "quest_case_01" and level.object_by_id(soc_case):parent() == nil
lua soc_model = string.gsub(system_ini():r_string("quest_case_01", "visual"), "%.ogf$", "") return "the section's model: " .. soc_model
lua_expect level.object_by_id(soc_case):get_visual_name() == soc_model

# Another one, given to the actor, is in the inventory with its icon
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
lua alife():create("quest_case_01", db.actor:position(), db.actor:level_vertex_id(), db.actor:game_vertex_id(), db.actor:id())
wait_seconds 2
lua_expect db.actor:object("quest_case_01") ~= nil
ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 1
ui_expect item:quest_case_01
screenshot soc_quest_case_inventory
ui_key kESCAPE
wait_seconds 1
lua_expect db.actor:alive()
quit
