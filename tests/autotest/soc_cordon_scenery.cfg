# SoC port: the scenery of the converted Cordon (l01_escape). The "soc" spawn holds the
# actor and the objects the spawn map files under Scenery: 210 physics props, breakable
# props, lamps, ladders and level breakables, the 54 loot crates (soc_cordon_crates.cfg), and a CoP-style crow spawner in place of
# SoC's 55 crows. Checks that the props are all in the simulation, that the ones near the
# actor come online, that a wooden crate breaks, and that the spawner makes crows, no more
# than its limit of 14.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# Every scenery object is in the simulation. The counts are exact on purpose: when the
# converter starts to carry other objects of these sections, update them here. The physic
# objects are 65 props and 4 scripted doors; the destroyable objects are 66 props, 54 loot
# crates and 7 scripted objects (soc_cordon_scripted.cfg); the lamps are SoC's 27 without
# the 11 of the camp fires, which the game's campfires light (soc_cordon_camps.cfg)
lua soc_n, soc_id = {}, {} for i = 0, 65534 do local o = alife():object(i) if o then local s = o:section_name() soc_n[s] = (soc_n[s] or 0) + 1 soc_id[o:name()] = i end end
lua local t = {} for s, n in pairs(soc_n) do t[#t + 1] = n .. " " .. s end table.sort(t) return table.concat(t, ", ")
lua_expect soc_n.physic_object == 69
lua_expect soc_n.physic_destroyable_object == 127
lua_expect soc_n.breakable_object == 49
lua_expect soc_n.lights_hanging_lamp == 16
lua_expect soc_n.climable_object == 14
lua_expect soc_id["esc_crow_spawner"] ~= nil

# Sidorovich's bunker: the lamp and the rifle on his desk are online
lua function soc_online(name) return soc_id[name] ~= nil and level.object_by_id(soc_id[name]) ~= nil end
lua function soc_look(x, y, z) db.actor:set_actor_direction(-vector():sub(vector():set(x, y, z), db.actor:position()):getH()) end
lua_expect soc_online("trader_light_0000")
lua_expect soc_online("trader_physic_object0009")
lua soc_look(-241.1, -24.0, -135.0)
wait_seconds 2
screenshot soc_scenery_bunker

# Newbie village: a ladder and a lamp on a house are online (checked as present only; the
# picture is of the place, not of them)
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
lua soc_look(-209.1, -20.8, -129.3)
wait_seconds 3
lua_expect soc_online("clmbl#8")
lua_expect soc_online("lights_white_glass_0003")
screenshot soc_scenery_village

# A wooden crate in a house at the east end of the village: it is there, and a hit breaks
# it into parts (new objects of the same section)
lua db.actor:set_actor_position(vector():set(-170.89, -20.01, -134.64))
lua soc_look(-175.9, -20.0, -134.6)
wait_seconds 3
lua_expect soc_online("esc_physic_destroyable_object_0045")
screenshot soc_scenery_crate
lua local h = hit() h.type = hit.strike h.power = 1000 h.impulse = 200 h.direction = vector():set(0, -1, 0) h.draftsman = db.actor level.object_by_id(soc_id["esc_physic_destroyable_object_0045"]):hit(h)
wait_seconds 1
lua soc_parts = 0 for i = 0, 65534 do local o = alife():object(i) if o and o:section_name() == "physic_destroyable_object" then soc_parts = soc_parts + 1 end end return soc_parts .. " destroyable objects after the hit"
lua_expect soc_parts > 120
wait_seconds 2
screenshot soc_scenery_crate_broken

# Level breakables (meshes in the level folder) by the road
lua db.actor:set_actor_position(vector():set(-74.0, -2.5, -73.0))
lua soc_look(-79.5, -3.2, -73.0)
wait_seconds 3
lua_expect soc_online([[meshes\brkbl#0.ogf]])
screenshot soc_scenery_breakables

# Crows: none are placed; the spawner (sr_crow_spawner, 7 patrol paths) has made some by
# now, away from the actor, and keeps to its limit
lua soc_crows = 0 for i = 0, 65534 do local o = alife():object(i) if o and o:section_name() == "m_crow" then soc_crows = soc_crows + 1 end end return soc_crows .. " crows on the level, " .. bind_crow.crow_counter .. " online"
lua_expect soc_crows >= 1 and soc_crows <= 14
quit
