# SoC port: the scripted objects of the converted Cordon (l01_escape). The "soc" spawn holds
# SoC's 12: ten doors (the door of the trader's bunker, three small metal doors behind it,
# six wooden cabinet doors), the loudspeaker of the army checkpoint and the army helicopter.
# The doors run the game's own door logic files; the trader's door, the loudspeaker and the
# helicopter run logic re-authored for the game's script framework (ph_door, ph_idle with
# sound themes, heli_move), with the info portions they use declared by the addon pack.
# Checked: all 12 are in the simulation and online with their logic running; the trader's
# door is locked, unlocks on esc_trader_can_leave, opens and closes on use and shuts on
# esc_close_door; a wooden door opens and closes on use; the loudspeaker plays its two day
# themes in turn with pauses, switches to the alarm and back, to the propaganda alone once
# the commander is dead, is silent at night and is turned off for good by a hit; the
# helicopter waits, takes off on esc_heli_go, gives esc_heli_direct on its way over the
# level and flies on.
# Not covered: using a door by hand (the use is made through the logic's callback), what
# is heard, the end of the helicopter's flight (it takes about three and a half minutes
# to leave the level) and whoever gives these info portions in the game (the story is not
# converted).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 4

# All 12 are in the simulation
lua soc_names = {"trader_door", "door0001", "door0002", "door0008", "esc_heli", "esc_matugalnik", "level_prefix_physic_destroyable_object_0000", "level_prefix_physic_destroyable_object_0001", "level_prefix_physic_destroyable_object_0002", "level_prefix_physic_destroyable_object_0003", "level_prefix_physic_destroyable_object_0004", "level_prefix_physic_destroyable_object_0005"}
lua soc_ids, soc_found = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o then for _, n in ipairs(soc_names) do if o:name() == n then soc_ids[n] = i soc_found = soc_found + 1 end end end end return soc_found .. " of " .. #soc_names .. " in the simulation"
lua_expect soc_found == 12

# ... and online, each with a section of its logic active
lua function soc_obj(n) return level.object_by_id(soc_ids[n]) end
lua function soc_sec(n) local st = db.storage[soc_ids[n]] return st and st.active_section end
lua soc_bad = {} for _, n in ipairs(soc_names) do if not (soc_obj(n) and soc_sec(n)) then soc_bad[#soc_bad + 1] = n end end return "without running logic: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The game's models where it has them (the loudspeaker is the game's speakerphone, chosen
# over its model of SoC's name); the small metal doors keep SoC's
lua_expect soc_obj("trader_door"):get_visual_name() == "dynamics\\door\\door_trader"
lua_expect soc_obj("door0001"):get_visual_name() == "physics\\door\\door_traders_box"
lua_expect soc_obj("esc_matugalnik"):get_visual_name() == "dynamics\\el_tehnika\\speakerphone"
lua_expect soc_obj("esc_heli"):get_visual_name() == "dynamics\\vehicles\\mi24\\veh_mi24_u_01"

# From here on the sections the loudspeaker and the helicopter go through are noted every
# frame, with the second each was first seen in; the loudspeaker is also seen playing
lua soc_seen, soc_t0, soc_played = {}, time_global(), false
lua function soc_note(n) local s = soc_sec(n) if s and not soc_seen[s] then soc_seen[s] = math.floor((time_global() - soc_t0) / 1000) end end
lua level.add_call(function() soc_note("esc_matugalnik") soc_note("esc_heli") if xr_sound.sound_table[soc_ids["esc_matugalnik"]] then soc_played = true end return false end, function() end)
lua function soc_report() local t = {} for s, at in pairs(soc_seen) do t[#t + 1] = s .. " at " .. at .. " s" end table.sort(t) return table.concat(t, ", ") end

# The helicopter waits outside the level with the engine off, then is sent off
lua_expect soc_sec("esc_heli") == "heli_move@idle"
lua soc_heli_from = vector():set(soc_obj("esc_heli"):position()) return "helicopter at " .. soc_heli_from.x .. ", " .. soc_heli_from.y .. ", " .. soc_heli_from.z
lua_expect not has_alife_info("esc_heli_direct")
lua db.actor:give_info_portion("esc_heli_go")

# The doors: the trader's and two of the metal ones locked, the others closed
lua function soc_door(n) return db.storage[soc_ids[n]].ph_door.door_action end
lua function soc_use(n) soc_door(n):use_callback(soc_obj(n), db.actor) end
lua_expect soc_sec("trader_door") == "ph_door@locked"
lua_expect soc_sec("door0001") == "ph_door@locked" and soc_sec("door0008") == "ph_door@locked"
lua_expect soc_sec("door0002") == "ph_door@close"
lua soc_bad = {} for i = 0, 5 do local n = "level_prefix_physic_destroyable_object_000" .. i if soc_sec(n) ~= "ph_door@close" then soc_bad[#soc_bad + 1] = n end end return "wooden doors not closed: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The trader's door: use does nothing while it is locked; the trader's word unlocks it
lua soc_use("trader_door")
wait_seconds 1
lua_expect soc_sec("trader_door") == "ph_door@locked"
lua db.actor:give_info_portion("esc_trader_can_leave")
wait_seconds 2
lua_expect soc_sec("trader_door") == "ph_door@closed"
lua_expect soc_door("trader_door"):is_closed()

# Use opens it
lua soc_use("trader_door")
wait_seconds 4
lua_expect soc_sec("trader_door") == "ph_door@open"
lua_expect soc_door("trader_door"):is_open()

# esc_close_door shuts it; the next use opens it again and takes that info portion back
lua db.actor:give_info_portion("esc_close_door")
wait_seconds 4
lua_expect soc_sec("trader_door") == "ph_door@closed"
lua_expect soc_door("trader_door"):is_closed()
lua soc_use("trader_door")
wait_seconds 1
lua_expect soc_sec("trader_door") == "ph_door@open"
lua_expect not has_alife_info("esc_close_door")

# A wooden door (the game's own logic file) opens and closes on use
lua soc_wood = "level_prefix_physic_destroyable_object_0000" soc_use(soc_wood)
wait_seconds 4
lua_expect soc_sec(soc_wood) == "ph_door@open"
lua_expect soc_door(soc_wood):is_open()
lua soc_use(soc_wood)
wait_seconds 4
lua_expect soc_sec(soc_wood) == "ph_door@close"
lua_expect soc_door(soc_wood):is_closed()

# The helicopter is on its way
lua_expect soc_sec("esc_heli") == "heli_move@fly"
lua return "helicopter " .. soc_obj("esc_heli"):position():distance_to(soc_heli_from) .. " m from where it waited"
lua_expect soc_obj("esc_heli"):position():distance_to(soc_heli_from) > 50

# The loudspeaker by day (the game starts in the morning): the commander's announcements
# and the propaganda take turns, with a pause after each
lua return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
lua_expect level.get_time_hours() >= 6 and level.get_time_hours() < 20
wait_seconds 40
lua return soc_report()
lua_expect soc_seen["ph_idle@humor"] ~= nil and soc_seen["ph_idle@wait"] ~= nil and soc_seen["ph_idle@epic"] ~= nil
lua_expect soc_played

# By now the helicopter has passed the point where it reports on the radio
lua_expect has_alife_info("esc_heli_direct")

# An alarm at the checkpoint: the alarm calls, until things are normal again
lua db.actor:give_info_portion("esc_blockpost_alarm")
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@alarm"
lua db.actor:give_info_portion("esc_blockpost_normal")
wait_seconds 3
lua_expect not has_alife_info("esc_blockpost_alarm")
lua return "after the alarm: " .. soc_sec("esc_matugalnik")
lua_expect soc_sec("esc_matugalnik") == "ph_idle@humor"

# The commander is dead: the propaganda alone
lua db.actor:give_info_portion("esc_commander_die")
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@epic_alone"

# Night (13 hours on): silence, and nothing plays; day again: back on
lua level.change_game_time(0, 13, 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@night"
lua_expect xr_sound.sound_table[soc_ids["esc_matugalnik"]] == nil
lua level.change_game_time(0, 12, 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@epic_alone"

# A hit turns it off for good
lua local h = hit() h.type = hit.strike h.power = 0.01 h.impulse = 0.1 h.direction = vector():set(0, -1, 0) h.draftsman = db.actor soc_obj("esc_matugalnik"):hit(h)
wait_seconds 3
lua_expect has_alife_info("esc_matugalnik_off")
lua_expect soc_sec("esc_matugalnik") == "ph_idle@off"
lua_expect xr_sound.sound_table[soc_ids["esc_matugalnik"]] == nil

# The helicopter is still on its round over the level, well away from where it waited
lua return soc_report()
lua local p = soc_obj("esc_heli"):position() return "helicopter at " .. p.x .. ", " .. p.y .. ", " .. p.z
lua_expect soc_sec("esc_heli") == "heli_move@fly"
lua_expect soc_obj("esc_heli"):position():distance_to(soc_heli_from) > 200

lua_expect db.actor:alive()
quit
