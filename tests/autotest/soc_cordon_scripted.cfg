# SoC port: the scripted objects of the converted Cordon (l01_escape). The "soc" spawn holds
# SoC's 13: ten doors (the door of the trader's bunker, three small metal doors behind it,
# six wooden cabinet doors), the loudspeaker of the army checkpoint and the army helicopter,
# and the zone that starts the helicopter (esc_heli_attack_zone).
# The doors run the game's own door logic files; the trader's door, the loudspeaker, the
# helicopter and its zone run logic re-authored for the game's script framework (ph_door,
# ph_idle with sound themes, heli_move, sr_idle with a sound theme), with the info portions
# they use declared by the addon pack.
# Checked: all 13 are in the simulation and online with their logic running; the trader's
# door starts closed and locked, unlocks on
# esc_trader_can_leave, opens and closes on use and shuts on esc_close_door; a wooden door opens and closes on use; the loudspeaker plays its two day
# themes in turn with pauses, switches to the alarm and back, to the propaganda alone once
# the commander is dead, is silent at night and is turned off for good by a hit; the
# helicopter waits until the actor steps into its zone, which gives esc_heli_go; it takes off,
# gives esc_heli_direct on its way over the level, the actor hears the army's radio talk, and
# it flies its route at SoC's speed (30 m/s) without slowing down to loop round a point, to
# its end in under 70 s, and goes on to its patrol.
# Not covered: using a door by hand (the use is made through the logic's callback), what
# is heard (only that the radio talk is played), and whoever gives these info portions in
# the game (the story is not converted; the trader, who lets the player out of his bunker,
# is in soc_cordon_trader.cfg).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 4

# All 13 are in the simulation
lua soc_names = {"trader_door", "door0001", "door0002", "door0008", "esc_heli", "esc_matugalnik", "level_prefix_physic_destroyable_object_0000", "level_prefix_physic_destroyable_object_0001", "level_prefix_physic_destroyable_object_0002", "level_prefix_physic_destroyable_object_0003", "level_prefix_physic_destroyable_object_0004", "level_prefix_physic_destroyable_object_0005", "esc_heli_attack_zone"}
lua soc_ids, soc_found = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o then for _, n in ipairs(soc_names) do if o:name() == n then soc_ids[n] = i soc_found = soc_found + 1 end end end end return soc_found .. " of " .. #soc_names .. " in the simulation"
lua_expect soc_found == 13

# ... and online, each with a section of its logic active
lua function soc_obj(n) return level.object_by_id(soc_ids[n]) end
lua function soc_sec(n) local st = db.storage[soc_ids[n]] return st and st.active_section end
lua soc_bad = {} for _, n in ipairs(soc_names) do if not (soc_obj(n) and soc_sec(n)) then soc_bad[#soc_bad + 1] = n end end return "without running logic: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The game's models: those of SoC's names, and for the small metal doors, which have none,
# the game's cabinet door
lua_expect soc_obj("trader_door"):get_visual_name() == "dynamics\\door\\door_trader"
lua_expect soc_obj("door0001"):get_visual_name() == "dynamics\\door\\shkaf_work_01_door"
lua_expect soc_obj("esc_matugalnik"):get_visual_name() == "dynamics\\el_tehnika\\rupor"
lua_expect soc_obj("esc_heli"):get_visual_name() == "dynamics\\vehicles\\mi24\\veh_mi24_u_01"

# From here on the sections the loudspeaker and the helicopter go through are noted every
# frame, with the second each was first seen in; the loudspeaker is also seen playing, and
# the radio talk playing for the actor
lua soc_seen, soc_t0, soc_played, soc_radio, soc_heli_top, soc_heli_low = {}, time_global(), false, false, 0, 1000
lua function soc_note(n) local s = soc_sec(n) if s and not soc_seen[s] then soc_seen[s] = math.floor((time_global() - soc_t0) / 1000) end end
lua level.add_call(function() soc_note("esc_matugalnik") soc_note("esc_heli") if xr_sound.sound_table[soc_ids["esc_matugalnik"]] then soc_played = true end local r = xr_sound.sound_table[db.actor:id()] if r and r.path and string.find(r.path, "esc_heli_radio", 1, true) then soc_radio = true end local heli = soc_obj("esc_heli") if heli then local v = heli:get_helicopter():GetCurrVelocity() if v > soc_heli_top then soc_heli_top = v end if soc_heli_top > 25 and soc_sec("esc_heli") == "heli_move@fly" and v < soc_heli_low then soc_heli_low = v end end return false end, function() end)
lua function soc_report() local t = {} for s, at in pairs(soc_seen) do t[#t + 1] = s .. " at " .. at .. " s" end table.sort(t) return table.concat(t, ", ") end

# The helicopter waits outside the level with the engine off, until the actor steps into its
# zone: that gives esc_heli_go, and the zone waits for the radio report
lua_expect soc_sec("esc_heli") == "heli_move@idle"
lua soc_heli_from = vector():set(soc_obj("esc_heli"):position()) return "helicopter at " .. soc_heli_from.x .. ", " .. soc_heli_from.y .. ", " .. soc_heli_from.z
lua_expect not has_alife_info("esc_heli_direct")
lua_expect soc_sec("esc_heli_attack_zone") == "sr_idle@actor"
lua_expect not has_alife_info("esc_heli_go") and not soc_obj("esc_heli_attack_zone"):inside(db.actor:position())
lua db.actor:set_actor_position(level.vertex_position(level.vertex_id(vector():set(-80.87, -1.75, -73.12))))
wait_seconds 1
lua_expect soc_obj("esc_heli_attack_zone"):inside(db.actor:position())
lua_expect has_alife_info("esc_heli_go")
lua_expect soc_sec("esc_heli_attack_zone") == "sr_idle@radio"

# The doors: the trader's and two of the metal ones locked, the others closed
lua function soc_door(n) return db.storage[soc_ids[n]].ph_door.door_action end
lua function soc_use(n) soc_door(n):use_callback(soc_obj(n), db.actor) end
lua_expect soc_sec("trader_door") == "ph_door@locked"
lua_expect soc_sec("door0001") == "ph_door@locked" and soc_sec("door0008") == "ph_door@locked"
lua_expect soc_sec("door0002") == "ph_door@close"
lua soc_bad = {} for i = 0, 5 do local n = "level_prefix_physic_destroyable_object_000" .. i if soc_sec(n) ~= "ph_door@close" then soc_bad[#soc_bad + 1] = n end end return "wooden doors not closed: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The trader's door: use does nothing while it is locked; the trader's word unlocks it
lua_expect soc_door("trader_door"):is_closed()
lua soc_use("trader_door")
wait_seconds 1
lua_expect soc_sec("trader_door") == "ph_door@locked"
lua db.actor:give_info_portion("esc_trader_can_leave")
wait_seconds 2
lua_expect soc_sec("trader_door") == "ph_door@closed"
lua_expect soc_door("trader_door"):is_closed()

# Use opens it
lua soc_use("trader_door")
wait_seconds 4
lua_expect soc_sec("trader_door") == "ph_door@open"
lua_expect soc_door("trader_door"):is_open()

# esc_close_door shuts it; the next use opens it again and takes that info portion back
lua db.actor:give_info_portion("esc_close_door")
wait_seconds 4
lua_expect soc_sec("trader_door") == "ph_door@closed"
lua_expect soc_door("trader_door"):is_closed()
lua soc_use("trader_door")
wait_seconds 1
lua_expect soc_sec("trader_door") == "ph_door@open"
lua_expect not has_alife_info("esc_close_door")

# A wooden door (the game's own logic file) opens and closes on use
lua soc_wood = "level_prefix_physic_destroyable_object_0000" soc_use(soc_wood)
wait_seconds 4
lua_expect soc_sec(soc_wood) == "ph_door@open"
lua_expect soc_door(soc_wood):is_open()
lua soc_use(soc_wood)
wait_seconds 4
lua_expect soc_sec(soc_wood) == "ph_door@close"
lua_expect soc_door(soc_wood):is_closed()

# The helicopter is on its way
lua_expect soc_sec("esc_heli") == "heli_move@fly"
lua return "helicopter " .. soc_obj("esc_heli"):position():distance_to(soc_heli_from) .. " m from where it waited"
lua_expect soc_obj("esc_heli"):position():distance_to(soc_heli_from) > 30

# The loudspeaker by day (the game starts in the morning): the commander's announcements
# and the propaganda take turns, with a pause after each
lua return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
lua_expect level.get_time_hours() >= 6 and level.get_time_hours() < 20
wait_seconds 40
lua return soc_report()
lua_expect soc_seen["ph_idle@humor"] ~= nil and soc_seen["ph_idle@wait"] ~= nil and soc_seen["ph_idle@epic"] ~= nil
lua_expect soc_played

# By now the helicopter has passed the point where it reports on the radio; the actor heard
# the radio talk and the zone is done
lua_expect has_alife_info("esc_heli_direct")
lua_expect soc_radio
lua_expect soc_sec("esc_heli_attack_zone") == nil or soc_sec("esc_heli_attack_zone") == "nil"

# It flies at SoC's speed, 30 m/s (the game's scheme takes it in km/h: 108)
lua return "helicopter top speed " .. soc_heli_top .. " m/s"
lua_expect soc_heli_top > 25 and soc_heli_top < 35

# An alarm at the checkpoint: the alarm calls, until things are normal again
lua db.actor:give_info_portion("esc_blockpost_alarm")
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@alarm"
lua db.actor:give_info_portion("esc_blockpost_normal")
wait_seconds 3
lua_expect not has_alife_info("esc_blockpost_alarm")
lua return "after the alarm: " .. soc_sec("esc_matugalnik")
lua_expect soc_sec("esc_matugalnik") == "ph_idle@humor" or soc_sec("esc_matugalnik") == "ph_idle@wait"

# The commander is dead: the propaganda alone
lua db.actor:give_info_portion("esc_commander_die")
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@epic_alone"

# Night (the clock put on to 23:00): silence, and nothing plays; day again (11 hours
# later): back on
lua level.change_game_time(0, 23 - level.get_time_hours(), 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@night"
lua_expect xr_sound.sound_table[soc_ids["esc_matugalnik"]] == nil
lua level.change_game_time(0, 11, 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 3
lua_expect soc_sec("esc_matugalnik") == "ph_idle@epic_alone"

# A hit turns it off for good
lua local h = hit() h.type = hit.strike h.power = 0.01 h.impulse = 0.1 h.direction = vector():set(0, -1, 0) h.draftsman = db.actor soc_obj("esc_matugalnik"):hit(h)
wait_seconds 3
lua_expect has_alife_info("esc_matugalnik_off")
lua_expect soc_sec("esc_matugalnik") == "ph_idle@off"
lua_expect xr_sound.sound_table[soc_ids["esc_matugalnik"]] == nil

# The helicopter has flown its route to the end (fly_end) and gone on to its patrol, in
# under 70 s, without slowing down to loop round a point once at speed (it did with the
# game's turning, flag_by_new_acc = 1; the pack gives it SoC's)
lua return soc_report()
lua return "helicopter section " .. alife():object(soc_ids["esc_heli"]):section_name() .. ", slowest on its route at speed " .. soc_heli_low .. " m/s"
lua_expect alife():object(soc_ids["esc_heli"]):section_name() == "helicopter_soc"
lua_expect soc_seen["heli_move@patrol"] ~= nil and soc_seen["heli_move@patrol"] < 70
lua_expect soc_heli_low > 10

lua_expect db.actor:alive()
quit
