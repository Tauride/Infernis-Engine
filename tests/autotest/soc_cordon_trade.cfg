# SoC port: trading with the trader of the converted Cordon (l01_escape), Sidorovich. He trades
# by SoC's trade file (misc\trade_trader.ltx), which the addon pack carries unchanged; his
# binder hands it to the game's trade_manager. The first scene is skipped: he is put in his
# idle poses as after his first words (soc_cordon_trader.cfg covers the scene).
# Checked: trade is on once the trade manager has set him up; what he stocks comes from SoC's
# start list; the talk shows the Trade button and it opens the trade window; an item he sells
# shows there with his goods, one he never sells (";NO TRADE") does not; the player buys the
# unique Groza (wpn_groza_m1, the pack's section derived from wpn_groza_nimble) and pays for it.
# When the bandits at the factory are dealt with (esc_kill_bandits_quest_done) he restocks from
# SoC's later list, and an item that list sells, the bandit jacket, shows in the window.
# His reactions (SoC's mob_trade scheme, which needs the engine to tell the trader that a trade
# starts and stops): nothing when the window opens, a phrase for the deal (trader_exchanged),
# one for a good trade when the window closes after a deal (trader_good_trade), and a grumble
# when it closes without one (trader_bad_trade).
# Not covered: selling to him (his buy list); prices against SoC's; restocking over time;
# what is heard (only which phrases he is told to play); saving and loading.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 2

lua soc_tid = get_story_object_id("Escape_Trader")
lua function soc_trader() return level.object_by_id(soc_tid) end
lua_expect soc_trader() ~= nil

# SoC's lists, read from the pack's trade file. Not from them: his PDA, and what he holds in his
# slots (a pistol he has of his own; the engine's restock keeps the weapons in his slots, so a
# Groza from the start list can stay there too)
lua soc_ini = ini_file("misc\\trade_trader.ltx") function soc_list(sec) local t = {} for i = 0, soc_ini:line_count(sec) - 1 do local _, k, v = soc_ini:r_line(sec, i, "", "") if v ~= nil and v ~= "" then t[k] = true end end return t end
lua function soc_items() local t = {} soc_trader():iterate_inventory(function(_, it) t[#t + 1] = it:section() end, nil) return t end
lua function soc_slotted() local t = {} for i = 1, 14 do local it = soc_trader():item_in_slot(i) if it then t[it:id()] = it:section() end end return t end
lua soc_own = {device_pda = true}
lua function soc_outside(list) local slotted, bad = soc_slotted(), {} soc_trader():iterate_inventory(function(_, it) local s = it:section() if not list[s] and not soc_own[s] and not slotted[it:id()] then bad[#bad + 1] = s end end, nil) return bad end

# The first scene is skipped: his first words are over, he is in his idle poses
lua db.actor:give_info_portion("esc_trader_hello_played") xr_logic.switch_to_section(soc_trader(), db.storage[soc_tid].ini, "mob_trader@new_idle1")

# The phrases he is told to play are noted, and every section his logic enters, in order
lua soc_phrases = {} local pick = mob_trader_sound.pick_sound_from_set mob_trader_sound.pick_sound_from_set = function(set, ...) soc_phrases[#soc_phrases + 1] = set return pick(set, ...) end
lua soc_secs, soc_last = {}, nil level.add_call(function() local st = db.storage[soc_tid] local s = st and st.active_section if s and s ~= soc_last then soc_last = s soc_secs[#soc_secs + 1] = s end return false end, function() end)
lua function soc_entered(s, from) for i = from or 1, #soc_secs do if soc_secs[i] == s then return true end end return false end

# He is given the Groza, an artefact he never sells and the bandit jacket, which he sells only
# after the factory; the player money
lua local t = soc_trader() for _, s in ipairs({"wpn_groza_m1", "af_medusa", "bandit_outfit"}) do alife():create(s, t:position(), t:level_vertex_id(), t:game_vertex_id(), soc_tid) end db.actor:give_money(100000)
wait_seconds 6

# Trade is on; what he stocks is from SoC's start list
lua return "his items: " .. table.concat(soc_items(), ", ")
lua_expect soc_trader():is_trade_enabled()
# A slot his inventory does not have gives nothing, not a crash (item_in_slot checks the slot)
lua_expect soc_trader():item_in_slot(0) == nil and soc_trader():item_in_slot(15) == nil and soc_trader():item_in_slot(1000) == nil
lua soc_own.af_medusa, soc_own.bandit_outfit, soc_own.wpn_groza_m1 = true, true, true
lua return "not from supplies_start: " .. table.concat(soc_outside(soc_list("supplies_start")), ", ")
lua_expect #soc_outside(soc_list("supplies_start")) == 0
lua_expect soc_trader():object("bread") ~= nil or soc_trader():object("conserva") ~= nil or soc_trader():object("kolbasa") ~= nil

# The talk has the Trade button, which opens the trade window
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
ui_wait 5 st:ui_st_trade
lua soc_said, soc_at = #soc_phrases, #soc_secs
ui_click st:ui_st_trade
ui_wait 5 class:CUIActorMenu
ui_wait 5 trade_buy_button

# The window opens: no reaction yet
wait_seconds 1
lua function soc_trade_secs(from) return soc_entered("mob_trader@new_trade_bad", from) or soc_entered("mob_trader@new_trade_good", from) or soc_entered("mob_trader@new_trade_exchanged", from) end
lua_expect #soc_phrases == soc_said and not soc_trade_secs(soc_at + 1)

# The Groza shows with his goods; the artefact he never sells and the jacket he does not sell yet do not
ui_expect item:wpn_groza_m1
ui_expect_no item:af_medusa
ui_expect_no item:bandit_outfit
ui_dump trade_start
screenshot_overlay soc_cordon_trade_window

# The player buys the Groza and pays for it
lua function soc_count(o, s) local n = 0 o:iterate_inventory(function(_, it) if it:section() == s then n = n + 1 end end, nil) return n end
lua soc_money, soc_grozas = db.actor:money(), soc_count(soc_trader(), "wpn_groza_m1")
ui_dblclick item:wpn_groza_m1
wait_seconds 1
ui_click trade_buy_button
wait_seconds 2
lua return string.format("paid %d", soc_money - db.actor:money())
lua_expect soc_count(db.actor, "wpn_groza_m1") == 1 and soc_count(soc_trader(), "wpn_groza_m1") == soc_grozas - 1
lua_expect db.actor:money() < soc_money

# The deal brings his phrase for it
lua return "sections: " .. table.concat(soc_secs, ", ", soc_at + 1) .. "; phrases: " .. table.concat(soc_phrases, ", ", soc_said + 1)
lua_expect soc_entered("mob_trader@new_trade_exchanged", soc_at + 1)
lua_expect soc_phrases[soc_said + 1] == "trader_exchanged" and #soc_phrases == soc_said + 1

# Escape leaves the trade window for the talk: a good trade, he says
lua soc_said, soc_at = #soc_phrases, #soc_secs
ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUIActorMenu
ui_expect class:CUITalkWnd
lua return "sections: " .. table.concat(soc_secs, ", ", soc_at + 1) .. "; phrases: " .. table.concat(soc_phrases, ", ", soc_said + 1)
lua_expect soc_entered("mob_trader@new_trade_good", soc_at + 1) and not soc_entered("mob_trader@new_trade_bad", soc_at + 1)
lua_expect soc_phrases[soc_said + 1] == "trader_good_trade" and #soc_phrases == soc_said + 1

# ... and the talk
ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUITalkWnd

# The bandits at the factory are dealt with: he restocks from SoC's later list (the restock
# takes away what he had, the items given to him too)
lua soc_own = {device_pda = true}
lua db.actor:give_info_portion("esc_kill_bandits_quest_done")
wait_seconds 7
lua return "his items: " .. table.concat(soc_items(), ", ")
lua local s = {} for _, n in pairs(soc_slotted()) do s[#s + 1] = n end return "in his slots: " .. table.concat(s, ", ") .. "; not from supplies_after_fabric: " .. table.concat(soc_outside(soc_list("supplies_after_fabric")), ", ")
lua_expect #soc_outside(soc_list("supplies_after_fabric")) == 0
lua local n = 0 for _, s in ipairs({"ammo_9x18_fmj", "ammo_9x18_pmm", "ammo_12x70_buck", "novice_outfit", "bandit_outfit", "killer_outfit", "stalker_outfit", "wpn_pb", "wpn_fort", "wpn_bm16", "wpn_mp5"}) do if soc_trader():object(s) then n = n + 1 end end soc_later = n return "later-only sections stocked: " .. n
lua_expect soc_later > 0

# The bandit jacket now shows in the window
lua local t = soc_trader() alife():create("bandit_outfit", t:position(), t:level_vertex_id(), t:game_vertex_id(), soc_tid)
wait_seconds 1
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
ui_wait 5 st:ui_st_trade
ui_click st:ui_st_trade
ui_wait 5 trade_buy_button
ui_expect item:bandit_outfit
ui_dump trade_after_fabric
screenshot_overlay soc_cordon_trade_after_fabric

# The window closed without a deal: he grumbles
lua soc_said, soc_at = #soc_phrases, #soc_secs
ui_key kESCAPE
wait_seconds 1
lua return "sections: " .. table.concat(soc_secs, ", ", soc_at + 1) .. "; phrases: " .. table.concat(soc_phrases, ", ", soc_said + 1)
lua_expect soc_entered("mob_trader@new_trade_bad", soc_at + 1) and not soc_entered("mob_trader@new_trade_good", soc_at + 1)
lua_expect soc_phrases[soc_said + 1] == "trader_bad_trade" and #soc_phrases == soc_said + 1
ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUITalkWnd
quit
