# SoC port: the trader of the converted Cordon (l01_escape), Sidorovich, and the first scene
# of the game in his bunker. The "soc" spawn holds SoC's escape_trader as SoC's trader class
# (CAI_Trader, the section m_trader), which the addon pack registers again, with the game's
# own model of him. He runs SoC's logic on the mob_trader scheme the pack brings, and SoC's
# start dialogue cut down to the first scene; the PDA tutorial is not converted.
# Checked, in a first new game: he is in the simulation and online as a trader with his
# story id, name and model; the actor starts facing him; the bunker door starts locked; he
# leans back, sits up, says his first words (trader_monolog1) and cannot be talked to until
# they end, then calls the player over (trader_come_here2); in the talk
# he offers the choice, "just give me a mission" brings the job, and
# its end gives esc_trader_can_leave, which unlocks the door, and closes the talk; talked
# to again he only asks why the player is still here; he sees the player off when he leaves
# and greets him when he comes back. In a second new game: "treat me like a rookie" brings
# the job as well, and a talk left after the choice goes on from the job.
# Not covered: starting the talk as a player does, by walking up to him and pressing the use
# key (the scenario opens the talk itself: the key reaches 2 m and he leans back out of
# its reach in some poses, as in SoC); what is heard (only which phrases he is told to
# play) and how his animations look (pictures to look at); trading (soc_cordon_trade.cfg);
# saving and loading.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300

# The phrases he is told to play are noted, and every section his logic goes through, with
# the second it was first seen in and whether he could be talked to in it
lua soc_phrases = {} local pick = mob_trader_sound.pick_sound_from_set mob_trader_sound.pick_sound_from_set = function(set, ...) soc_phrases[#soc_phrases + 1] = set return pick(set, ...) end
lua soc_tid = get_story_object_id("Escape_Trader") return "trader id " .. tostring(soc_tid)
lua_expect soc_tid ~= nil
lua function soc_trader() return level.object_by_id(soc_tid) end
lua function soc_sec() local st = db.storage[soc_tid] return st and st.active_section end
lua soc_seen, soc_talk, soc_order, soc_t0 = {}, {}, {}, time_global()
lua level.add_call(function() local s = soc_sec() if s and soc_trader() then if not soc_seen[s] then soc_seen[s] = math.floor((time_global() - soc_t0) / 100) / 10 soc_order[#soc_order + 1] = s .. " at " .. soc_seen[s] .. " s" end soc_talk[s] = soc_talk[s] or soc_trader():is_talk_enabled() end return false end, function() end)
lua function soc_before(a, b) return soc_seen[a] ~= nil and soc_seen[b] ~= nil and soc_seen[a] <= soc_seen[b] end

# He is SoC's trader class, online, with the game's model of him and SoC's name
lua_expect alife():object(soc_tid):name() == "escape_trader" and alife():object(soc_tid):section_name() == "m_trader"
lua_expect soc_trader() ~= nil and soc_trader():alive()
lua_expect soc_trader():clsid() == clsid.script_trader
lua_expect soc_trader():get_visual_name() == "actors\\stalker_trader\\stalker_trader_1"
lua_expect soc_trader():character_name() == game.translate_string("escape_trader_name")
lua_expect game.translate_string("escape_trader_name") ~= "escape_trader_name"
lua_expect soc_trader():position():distance_to(vector():set(-244.69, -24.96, -133.96)) < 0.5

# The actor starts 2 m from him and faces him, as in SoC
lua soc_to = vector():sub(soc_trader():position(), db.actor:position()) return string.format("trader %.1f m from the actor, %.2f rad off the camera's heading", soc_to:magnitude(), math.abs(soc_to:getH() - device().cam_dir:getH()))
lua_expect soc_to:magnitude() < 3 and math.abs(soc_to:getH() - device().cam_dir:getH()) < 0.3

# The door of the bunker starts locked; nothing of the scene has happened yet
lua soc_door_id = nil for i = 0, 65534 do local o = alife():object(i) if o and o:name() == "trader_door" and level.object_by_id(i) then soc_door_id = i end end
lua function soc_door_sec() return db.storage[soc_door_id].active_section end
lua function soc_door() return db.storage[soc_door_id].ph_door.door_action end
lua_expect soc_door_sec() == "ph_door@locked" and soc_door():is_closed()
lua soc_bad = {} for _, i in ipairs({"esc_trader_hello_played", "esc_trader_tutorial_chosen", "esc_trader_experienced", "esc_trader_newbie", "esc_trader_can_leave", "tutorial_wounded_start"}) do if has_alife_info(i) then soc_bad[#soc_bad + 1] = i end end return "given too early: " .. table.concat(soc_bad, ", ")
lua_expect #soc_bad == 0

# The start: he leans back and cannot be talked to
lua_expect soc_sec() == "mob_trader@new_start_wait"
lua_expect not soc_trader():is_talk_enabled()
screenshot soc_cordon_trader_start

# After 5 s he sits up and says his first words (about 29 s: the two animations are played
# at 80% of their speed, to keep pace with the voice); no talking meanwhile
wait_seconds 14
lua return table.concat(soc_order, ", ")
lua_expect soc_before("mob_trader@new_start_wait", "mob_trader@new_start_intro1") and soc_before("mob_trader@new_start_intro1", "mob_trader@new_start_intro2")
lua_expect soc_sec() == "mob_trader@new_start_intro2"
lua_expect has_alife_info("esc_trader_hello_played")
lua_expect soc_phrases[1] == "trader_monolog1" and #soc_phrases == 1
lua_expect not soc_trader():is_talk_enabled()
screenshot soc_cordon_trader_monologue

# The words end (36 s after the start): he sits at his desk and can be talked to, after 5 s
# calls the player over, and goes on to his idle poses (45 s; the wait leaves room for a slow run)
wait_seconds 42
lua return table.concat(soc_order, ", ")
lua_expect soc_before("mob_trader@new_start_intro2", "mob_trader@new_start_intro3") and soc_before("mob_trader@new_start_intro3", "mob_trader@new_start_intro4") and soc_before("mob_trader@new_start_intro4", "mob_trader@new_idle1")
lua_expect soc_seen["mob_trader@new_start_intro3"] - soc_seen["mob_trader@new_start_intro2"] > 24
lua_expect not soc_talk["mob_trader@new_start_wait"] and not soc_talk["mob_trader@new_start_intro1"] and not soc_talk["mob_trader@new_start_intro2"]
lua_expect soc_talk["mob_trader@new_start_intro3"] and soc_trader():is_talk_enabled()
lua_expect soc_phrases[2] == "trader_come_here2" and #soc_phrases == 2

# The player talks to him (the scenario opens the talk)
ui_expect_no class:CUITalkWnd
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
lua_expect db.actor:is_talking()
ui_wait 5 st:escape_trader_start_dialog_3
ui_expect st:escape_trader_start_dialog_31
ui_expect st:escape_trader_start_dialog_32
ui_expect st:escape_trader_name
ui_dump trader_choice
screenshot_overlay soc_cordon_trader_choice

# "Just give me a mission": the job
ui_click st:escape_trader_start_dialog_32
ui_wait 5 st:escape_trader_start_dialog_321
lua_expect has_alife_info("esc_trader_experienced") and has_alife_info("esc_trader_tutorial_chosen") and not has_alife_info("esc_trader_newbie")
lua_expect not has_alife_info("esc_trader_can_leave") and soc_door_sec() == "ph_door@locked"
ui_click st:escape_trader_start_dialog_3211
ui_wait 5 st:escape_trader_start_dialog_32111

# Its end lets the player out: the door unlocks
wait_seconds 1
lua_expect has_alife_info("esc_trader_can_leave") and has_alife_info("tutorial_wounded_start")
lua_expect soc_door_sec() == "ph_door@closed" and soc_door():is_closed()
screenshot_overlay soc_cordon_trader_job

# The player's last line ends the talk
ui_click st:escape_trader_start_dialog_321111
wait_seconds 1
ui_expect_no class:CUITalkWnd
lua_expect not db.actor:is_talking()

# Talked to again he only asks why the player is still here; Escape leaves the talk
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
ui_wait 5 st:escape_trader_start_dialog_181
ui_expect_no st:escape_trader_start_dialog_3
ui_expect_no st:escape_trader_start_dialog_321
ui_dump trader_again
ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUITalkWnd

# The unlocked door opens on use
lua soc_door():use_callback(level.object_by_id(soc_door_id), db.actor)
wait_seconds 3
lua_expect soc_door_sec() == "ph_door@open" and soc_door():is_open()

# The player leaves for the village: he sees him off (over 5 m), then waits (over 12 m)
lua soc_at_counter = vector():set(db.actor:position()) soc_said = #soc_phrases
lua_expect soc_seen["mob_trader@new_wait"] == nil and soc_seen["mob_trader@new_bye"] == nil
lua db.actor:set_actor_position(vector():set(-199.87, -19.4, -137.11))
wait_seconds 15
lua return table.concat(soc_order, ", ") .. "; phrases: " .. table.concat(soc_phrases, ", ")
lua_expect soc_before("mob_trader@new_bye", "mob_trader@new_wait")
lua_expect soc_phrases[soc_said + 1] == "trader_bye" and #soc_phrases == soc_said + 1
lua_expect not has_alife_info("esc_trader_hello_played") and not has_alife_info("esc_trader_bye_played")

# ... and greets him when he is back at the counter
lua soc_said = #soc_phrases db.actor:set_actor_position(soc_at_counter)
wait_seconds 3
lua_expect soc_seen["mob_trader@new_hello"] ~= nil
lua_expect soc_phrases[soc_said + 1] == "trader_hello_what_have_you_got"
lua_expect has_alife_info("esc_trader_hello_played")

# A second new game, for the other choice. The start is skipped: he is put at his desk
# where his first words have ended, and the player talks to him while he calls him over
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 2
lua soc_phrases = {} local pick = mob_trader_sound.pick_sound_from_set mob_trader_sound.pick_sound_from_set = function(set, ...) soc_phrases[#soc_phrases + 1] = set return pick(set, ...) end
lua soc_tid = get_story_object_id("Escape_Trader")
lua function soc_trader() return level.object_by_id(soc_tid) end
lua function soc_sec() local st = db.storage[soc_tid] return st and st.active_section end
lua_expect soc_trader() ~= nil and not has_alife_info("esc_trader_tutorial_chosen")
lua soc_said = #soc_phrases db.actor:give_info_portion("esc_trader_hello_played") xr_logic.switch_to_section(soc_trader(), db.storage[soc_tid].ini, "mob_trader@new_start_intro3")
wait_seconds 7
lua_expect soc_sec() == "mob_trader@new_start_intro4"
lua_expect soc_phrases[soc_said + 1] == "trader_come_here2" and #soc_phrases == soc_said + 1
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
ui_wait 5 st:escape_trader_start_dialog_3

# "Treat me like a rookie": the job too (SoC ran the PDA tutorial here, which is not converted)
ui_click st:escape_trader_start_dialog_31
ui_wait 5 st:escape_trader_start_dialog_321
lua_expect has_alife_info("esc_trader_newbie") and has_alife_info("esc_trader_tutorial_chosen") and not has_alife_info("esc_trader_experienced")

# The talk stops the phrase he was saying; he does not wait for its end but turns to the
# player (the engine reports no end for a phrase stopped by a talk)
wait_seconds 8
lua_expect soc_sec() == "mob_trader@new_talking"

# The talk left here goes on from the job, not from the choice
ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUITalkWnd
lua_expect not has_alife_info("esc_trader_can_leave")
lua db.actor:run_talk_dialog(soc_trader(), false)
ui_wait 5 class:CUITalkWnd
ui_wait 5 st:escape_trader_start_dialog_321
ui_expect_no st:escape_trader_start_dialog_3
ui_click st:escape_trader_start_dialog_3211
ui_wait 5 st:escape_trader_start_dialog_32111
ui_click st:escape_trader_start_dialog_321111
wait_seconds 1
ui_expect_no class:CUITalkWnd
lua_expect has_alife_info("esc_trader_can_leave")
quit
