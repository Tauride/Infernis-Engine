# SoC port: the control tutorials of the converted Cordon (l01_escape, SoC's esc_tutorial.ltx on
# esc_tutorial_zone) and the second zone of the trader's tip about anomalies
# (tip_esc_trader_about_anomalies, inside esc_suicidal_flash_restrictor). The addon pack adds
# SoC's tutorial parts to the game's ui\game_tutorials.xml with their texts, and SoC's condition
# can_send_tutorial to the game's xr_conditions.script, asking the game's UI.
# Checked: both zones are online with their logic; nothing before the actor leaves the bunker
# (esc_tutorial_start); then the jump hint after 1 s, waiting while the PDA is open; the crouch
# hint 7 s later, waiting while the inventory is open; the sprint hint 7 s after that; each
# gives its encyclopedy_tutorial_* info; sent to the railway passage
# (esc_find_railroad_passage_find_stalker), the actor gets the PDA diary hint, and the chain goes
# on to the binoculars; the second tip zone gives the trader's tip once the tutorial flesh has
# died, and not before.
# Not covered: the relations hint (20 s after the binoculars); how the hints look (pictures to
# look at); what is heard with the tip (only that it is given); the PDA opened several times
# before the tutorial asks (the condition reads ui_pda and ui_pda_hide, which the engine keeps).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 2

# Both zones are online, with their logic
lua soc_ids = {} for i = 0, 65534 do local o = alife():object(i) if o then local n = o:name() if n == "esc_tutorial_zone" then soc_ids.tut = i elseif string.find(n, "^tip_esc_trader_about_anomalies") then soc_ids.tip = i elseif n == "esc_suicidal_flash_restrictor" then soc_ids.big = i end end end return "tutorial zone " .. tostring(soc_ids.tut) .. ", tip zone " .. tostring(soc_ids.tip) .. ", big zone " .. tostring(soc_ids.big)
lua function soc_sec(k) local st = db.storage[soc_ids[k]] return st and st.active_section end
lua_expect level.object_by_id(soc_ids.tut) ~= nil and level.object_by_id(soc_ids.tip) ~= nil
lua_expect soc_sec("tut") == "sr_idle@tutorial" and soc_sec("tip") == "sr_idle@wait"

# Each start of a tutorial is counted (soc_started)
lua soc_started, soc_was = 0, false level.add_call(function() local on = game.has_active_tutorial() if on and not soc_was then soc_started = soc_started + 1 end soc_was = on return false end, function() end)

# Nothing before the actor leaves the bunker
lua_expect not game.has_active_tutorial() and not has_alife_info("encyclopedy_tutorial_jump")

# The PDA is open when he leaves (the info esc_tutorial_trigger gives): the jump hint, due a second
# later, waits while the PDA is open
ui_key active_jobs
wait_seconds 2
lua_expect has_alife_info("ui_pda")
lua db.actor:give_info_portion("esc_tutorial_start")
wait_seconds 3
lua return "section " .. tostring(soc_sec("tut")) .. "; tutorial on: " .. tostring(game.has_active_tutorial())
lua_expect soc_sec("tut") == "sr_idle@wait_jump_tutor" and not game.has_active_tutorial() and not has_alife_info("encyclopedy_tutorial_jump")

# The PDA closes: the jump hint
ui_key active_jobs
wait_seconds 2
lua_expect soc_started == 1
lua_expect game.has_active_tutorial() and has_alife_info("encyclopedy_tutorial_jump") and soc_sec("tut") == "sr_idle@tutorial_crouch"
screenshot_overlay soc_cordon_tutorial_jump

# The crouch hint is due 7 s after the jump hint started; the inventory is opened while the
# jump hint still shows and stays open past that, so the crouch hint waits until it closes
ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 7
lua return "section " .. tostring(soc_sec("tut")) .. "; tutorial on: " .. tostring(game.has_active_tutorial())
lua_expect soc_sec("tut") == "sr_idle@wait_crouch_tutor" and not game.has_active_tutorial() and not has_alife_info("encyclopedy_tutorial_crouch")

# The inventory closes: the crouch hint
ui_key kESCAPE
wait_seconds 3
lua_expect soc_started == 2
lua_expect has_alife_info("encyclopedy_tutorial_crouch") and soc_sec("tut") == "sr_idle@tutorial_sprint"

# The sprint hint 7 s after the crouch hint started (no window is open)
wait_seconds 5
lua_expect soc_started == 3
lua_expect has_alife_info("encyclopedy_tutorial_sprint") and soc_sec("tut") == "sr_idle@tutorial_binoc"

# Sent to the railway passage: the PDA diary hint once the sprint hint (10 s) is over; then the
# chain goes on through the hints already seen to the binoculars, 20 s after the sprint hint ended
lua db.actor:give_info_portion("esc_find_railroad_passage_find_stalker")
wait_seconds 15
lua_expect soc_started == 4
lua_expect has_alife_info("encyclopedy_tutorial_diary")
wait_seconds 35
lua_expect soc_started == 5
lua_expect has_alife_info("encyclopedy_tutorial_binocular") and soc_sec("tut") == "sr_idle@tutorial_relat"

# The second tip zone: the big zone round it is put out of the way, so only this one can send
# the tip. Before the flesh has died, nothing
lua xr_logic.switch_to_section(level.object_by_id(soc_ids.big), db.storage[soc_ids.big].ini, "nil")
lua local p = level.object_by_id(soc_ids.tip):position() db.actor:set_actor_position(vector():set(p.x, p.y, p.z))
wait_seconds 2
lua_expect level.object_by_id(soc_ids.tip):inside(db.actor:position())
lua_expect not has_alife_info("tips_esc_trader_about_anomalies") and soc_sec("tip") == "sr_idle@wait"

# ... once it has died, the tip, and the zone ends
lua db.actor:give_info_portion("tutorial_flesh_die")
wait_seconds 2
lua_expect has_alife_info("tips_esc_trader_about_anomalies") and soc_sec("tip") == nil
quit
