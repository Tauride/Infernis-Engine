# SoC port: the newbie village of the converted Cordon, SoC's gulag esc_lager re-authored as a
# smart terrain of the game with its population in squads (docs/levels/cordon.md of the design
# documentation, "Village population (esc_lager)").
# Checked:
# - the smart is in the game with its config (max_population 3, respawn_idle 3600);
# - on its first respawn try it makes its three start squads (esc_lager7 and esc_lager2,
#   esc_lager4 and esc_lager6, esc_lager1, esc_lager3 and esc_lager5) and counts them as its
#   3 novice squads; no advanced squad;
# - each novice is on his job: the leaders on the guard posts, the partners on the walkers,
#   the three at the camp seats; online they run those sections, the three at the fire are
#   in the village camp, and esc_lager3 carries a guitar;
# - at night the seats of esc_lager1 and esc_lager5 switch to sleeping, esc_lager3 stays;
# - esc_lager7 killed on his post gives esc_lager_guard1_dead (the post opens to anyone);
#   once esc_lager2 is dead too the squad is gone and the novices' count is 2;
# - esc_lager4 killed offline (the actor away) gives esc_lager_guard2_dead all the same;
# - with the actor away, no respawn within the hour (respawn_idle, over the game's 1000 s),
#   one after it: a novice squad of 3, count 3 again; the two open posts are taken by others;
# - after escape_lager_complete the novices' cap is 2 and the advanced section's 1: an
#   hour later one advanced squad of 2 comes, with the 3 novice squads still there (the
#   accepted overlap).
# A picture of the camp by day. Not covered: the guitar actually played and the stories (the
# camp manager picks them by chance), what the guards say, the sleepers lying down.
# The actor is invulnerable (g_god): the novices are armed and he walks among them.
# Run with -ExtraArgs "-dev_mode": g_god is a developer command.
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
g_god on
wait_seconds 5

# The smart and its config
lua soc_smart = smart_terrain.smart_terrains_by_name["esc_lager"] return "smart " .. tostring(soc_smart and soc_smart.id)
lua_expect soc_smart ~= nil and soc_smart:section_name() == "smart_terrain"
lua_expect soc_smart.max_population == 3
lua_expect soc_smart.respawn_idle == 3600

# The start squads, counted as the 3 novice squads
lua function soc_count(sect) return soc_smart.already_spawned[sect].num end
lua_expect soc_count("novices") == 3
lua_expect soc_count("advanced") == 0
lua soc_squads = {} for _, sid in ipairs({"esc_lager_guard1_squad", "esc_lager_guard2_squad", "esc_lager_camp_squad"}) do soc_squads[sid] = get_story_squad(sid) end return "squads made"
lua_expect soc_squads.esc_lager_guard1_squad and soc_squads.esc_lager_guard1_squad:npc_count() == 2
lua_expect soc_squads.esc_lager_guard2_squad and soc_squads.esc_lager_guard2_squad:npc_count() == 2
lua_expect soc_squads.esc_lager_camp_squad and soc_squads.esc_lager_camp_squad:npc_count() == 3

# Each novice on his job. A squad member's name is his section and his id.
lua soc_jobs = {esc_lager7 = "guard1", esc_lager4 = "guard2", esc_lager2 = "walker", esc_lager6 = "walker", esc_lager1 = "camp1", esc_lager5 = "camp2", esc_lager3 = "camp3"}
lua function soc_who(name) for k in pairs(soc_jobs) do if string.find(name, k, 1, true) == 1 then return k end end end
lua soc_ids, soc_wrong = {}, {} for id, info in pairs(soc_smart.npc_info) do local o = alife():object(id) local k = o and soc_who(o:name()) local j = soc_smart.job_data[info.job_id] if k then soc_ids[k] = id if not (j and string.find(j.section, "esc_lager_" .. soc_jobs[k], 1, true)) then soc_wrong[#soc_wrong + 1] = k .. " on " .. tostring(j and j.section) end end end return "wrong jobs: " .. table.concat(soc_wrong, ", ")
lua_expect #soc_wrong == 0
lua local n = 0 for _ in pairs(soc_ids) do n = n + 1 end return n .. " novices"
lua_expect soc_ids.esc_lager1 and soc_ids.esc_lager2 and soc_ids.esc_lager3 and soc_ids.esc_lager4 and soc_ids.esc_lager5 and soc_ids.esc_lager6 and soc_ids.esc_lager7

# Online in the village: the sections they run, the camp, the guitar
lua db.actor:set_actor_position(vector():set(-203.0, -19.6, -137.0))
wait_seconds 15
lua function soc_section(k) local st = db.storage[soc_ids[k]] return st and st.active_section end
lua local t = {} for k in pairs(soc_jobs) do t[#t + 1] = k .. "=" .. tostring(soc_section(k)) end return table.concat(t, " ")
lua_expect soc_section("esc_lager7") == "walker@esc_lager_guard1"
lua_expect soc_section("esc_lager4") == "walker@esc_lager_guard2"
lua_expect string.find(tostring(soc_section("esc_lager2")), "walker@esc_lager_walker", 1, true)
lua_expect string.find(tostring(soc_section("esc_lager6")), "walker@esc_lager_walker", 1, true)
lua_expect soc_section("esc_lager1") == "animpoint@esc_lager_camp1"
lua_expect soc_section("esc_lager5") == "animpoint@esc_lager_camp2"
lua_expect soc_section("esc_lager3") == "animpoint@esc_lager_camp3"
lua soc_camp = nil for id, c in pairs(bind_camp.camps) do if c.object:name() == "camp_fire_0004" then soc_camp = id end end return "camp " .. tostring(soc_camp)
wait_seconds 20
lua local t = {} for _, k in ipairs({"esc_lager1", "esc_lager3", "esc_lager5"}) do t[#t + 1] = k .. " camp " .. tostring(db.storage[soc_ids[k]].registred_camp) end return table.concat(t, ", ")
lua_expect db.storage[soc_ids.esc_lager1].registred_camp == soc_camp
lua_expect db.storage[soc_ids.esc_lager3].registred_camp == soc_camp
lua_expect db.storage[soc_ids.esc_lager5].registred_camp == soc_camp
lua_expect level.object_by_id(soc_ids.esc_lager3):object("guitar_a") ~= nil

# A picture of the camp by day
# 4 m from the fire, looking at it (yaw: minus the heading from there to the fire)
pose -204.0 -19.8 -137.2 -2.348 0.0
wait_seconds 3
screenshot soc_village_camp_day

# At night esc_lager1 and esc_lager5 go to sleep; esc_lager3 stays at the fire
lua level.change_game_time(0, 23 - level.get_time_hours(), 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 5
lua return "night: 1=" .. tostring(soc_section("esc_lager1")) .. " 5=" .. tostring(soc_section("esc_lager5")) .. " 3=" .. tostring(soc_section("esc_lager3"))
lua_expect soc_section("esc_lager1") == "sleeper@esc_lager_camp1"
lua_expect soc_section("esc_lager5") == "sleeper@esc_lager_camp2"
lua_expect soc_section("esc_lager3") == "animpoint@esc_lager_camp3"
lua level.change_game_time(0, 11, 0) return "time " .. level.get_time_hours() .. ":" .. level.get_time_minutes()
wait_seconds 5

# esc_lager7 dies on his post: the post opens; with esc_lager2 dead too the squad is gone
lua local o = level.object_by_id(soc_ids.esc_lager7) o:kill(o)
wait_seconds 2
lua_expect has_alife_info("esc_lager_guard1_dead")
lua local o = level.object_by_id(soc_ids.esc_lager2) o:kill(o)
wait_seconds 3
lua return "guard1 squad " .. tostring(get_story_squad("esc_lager_guard1_squad")) .. ", novices " .. soc_count("novices")
lua_expect get_story_squad("esc_lager_guard1_squad") == nil
lua_expect soc_count("novices") == 2

# With the actor away: esc_lager4 dies offline (killed on the server, as the surge kills the
# NPCs away from the actor, with no death event); the smart clears him and his post opens
lua db.actor:set_actor_position(vector():set(52.9, 2.3, 162.2))
wait_seconds 3
lua_expect level.object_by_id(soc_ids.esc_lager4) == nil
lua alife():object(soc_ids.esc_lager4):kill() return "esc_lager4 killed offline"
wait_seconds 5
lua_expect soc_smart.npc_info[soc_ids.esc_lager4] == nil
lua_expect has_alife_info("esc_lager_guard2_dead")

# The respawn, timed from now (a try that the actor's distance stopped also restarts the
# hour): none within the hour, one after it; the open posts are taken (by whoever ranks them
# highest: the game moves an NPC up to a job of higher priority)
lua soc_smart.last_respawn_update = game.get_game_time() return "respawn timer restarted"
lua level.change_game_time(0, 0, 30) return "half an hour on, novices " .. soc_count("novices")
wait_seconds 5
lua_expect soc_count("novices") == 2
lua level.change_game_time(0, 0, 35) return "an hour on"
wait_seconds 5
lua soc_novice_squads = {} for id, q in pairs(sim_board.get_sim_board().smarts[soc_smart.id].squads) do if q:section_name() == "esc_lager_novice_squad" then soc_novice_squads[#soc_novice_squads + 1] = q end end return "novices " .. soc_count("novices") .. ", respawned squads " .. #soc_novice_squads
lua_expect soc_count("novices") == 3
lua_expect #soc_novice_squads == 1 and soc_novice_squads[1]:npc_count() == 3
wait_seconds 3
lua soc_posts = {} for id, info in pairs(soc_smart.npc_info) do local j = soc_smart.job_data[info.job_id] local o = alife():object(id) if j and o and string.find(j.section, "logic@esc_lager_guard", 1, true) then soc_posts[j.section] = o:name() end end return "posts: guard1 " .. tostring(soc_posts["logic@esc_lager_guard1"]) .. ", guard2 " .. tostring(soc_posts["logic@esc_lager_guard2"])
lua function soc_post_ok(post) local n = soc_posts[post] return n ~= nil and string.find(n, "esc_lager7", 1, true) ~= 1 and string.find(n, "esc_lager4", 1, true) ~= 1 end
lua_expect soc_post_ok("logic@esc_lager_guard1")
lua_expect soc_post_ok("logic@esc_lager_guard2")

# After escape_lager_complete: one advanced squad of 2 an hour later, the novices staying at 3
lua db.actor:give_info_portion("escape_lager_complete")
lua level.change_game_time(0, 1, 5) return "an hour on"
wait_seconds 5
lua soc_advanced = {} for id, q in pairs(sim_board.get_sim_board().smarts[soc_smart.id].squads) do if q:section_name() == "esc_lager_advanced_squad" then soc_advanced[#soc_advanced + 1] = q end end return "advanced " .. soc_count("advanced") .. ", squads " .. #soc_advanced .. ", novices " .. soc_count("novices")
lua_expect soc_count("advanced") == 1
lua_expect #soc_advanced == 1 and soc_advanced[1]:npc_count() == 2
lua_expect soc_count("novices") == 3

lua_expect db.actor:alive()
g_god off
quit
