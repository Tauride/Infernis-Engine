# SoC port: the weapons lying in the world of the converted Cordon (l01_escape). The "soc"
# spawn holds SoC's four: a PM and an AKS-74U side by side at the army checkpoint, a sawn-off
# shotgun on a wagon roof and a Walther in a ruined house. They keep their SoC spawn packets,
# on the game's sections and models. Checks that all four are in the simulation, come online
# near the actor as the game's weapon with its model, unloaded and in full condition as SoC
# placed them, and stay where they were put (do not fall through the level).
# The AKS-74U matters most: the game gives it another server class than SoC did (one that
# can take a grenade launcher), with a different update packet.
# Not covered: picking a weapon up and firing it.
# The viewpoints were recorded by a person with ask_pose (see README.md).
# Needs the SoC addon pack in the game folder (built by tools/level-convert in the design
# documentation repository).

wait_frames 60
start server(soc/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

# All four are in the simulation, on no one, and are the only loose weapons of the level
lua soc_wpn = {esc_wpn_pm = "wpn_pm", esc_wpn_ak74u = "wpn_ak74u", esc_wpn_bm16 = "wpn_bm16", esc_wpn_walther = "wpn_walther"}
lua soc_id, soc_loose = {}, 0 for i = 0, 65534 do local o = alife():object(i) if o then soc_id[o:name()] = i if o.parent_id == 65535 and string.sub(o:section_name(), 1, 4) == "wpn_" then soc_loose = soc_loose + 1 end end end return soc_loose .. " weapons lying in the world"
lua_expect soc_loose == 4
lua soc_known = 0 for n, s in pairs(soc_wpn) do local o = soc_id[n] and alife():object(soc_id[n]) if o and o:section_name() == s and o.parent_id == 65535 then soc_known = soc_known + 1 end end return soc_known .. " of them SoC's"
lua_expect soc_known == 4

lua function soc_obj(n) return level.object_by_id(soc_id[n]) end
# Online, the game's weapon of that section with the game's model, full condition, unloaded
lua function soc_ok(n) local o = soc_obj(n) return o ~= nil and o:section() == soc_wpn[n] and o:parent() == nil and o:condition() > 0.99 and o:get_ammo_in_magazine() == 0 and o:get_visual_name() == string.gsub(system_ini():r_string(soc_wpn[n], "visual"), "%.ogf$", "") end
# Within 1.5 m of where SoC placed it: it lies there, it has not dropped out of the level
lua function soc_at(n, x, y, z) local p = soc_obj(n):position() local d = p:distance_to(vector():set(x, y, z)) return d < 1.5, string.format("%s at %.1f %.1f %.1f, %.2f m from its place", n, p.x, p.y, p.z, d) end
lua function soc_say(n) local o = soc_obj(n) if not o then return n .. " is offline" end return string.format("%s: %s, model %s, condition %.2f, %d rounds", n, o:section(), o:get_visual_name(), o:condition(), o:get_ammo_in_magazine()) end

# The PM and the AKS-74U, side by side
pose -136.28 -29.69 -357.26 -3.114 0.323
wait_seconds 5
lua return soc_say("esc_wpn_pm")
lua return soc_say("esc_wpn_ak74u")
lua_expect soc_ok("esc_wpn_pm")
lua_expect soc_ok("esc_wpn_ak74u")
lua_expect soc_at("esc_wpn_pm", -136.59, -28.72, -359.26)
lua_expect soc_at("esc_wpn_ak74u", -136.22, -28.72, -359.62)
screenshot soc_weapons_pm_ak74u

# The sawn-off shotgun
pose 341.35 18.55 240.42 -1.749 0.873
wait_seconds 5
lua return soc_say("esc_wpn_bm16")
lua_expect soc_ok("esc_wpn_bm16")
lua_expect soc_at("esc_wpn_bm16", 340.02, 18.63, 239.99)
screenshot soc_weapons_bm16

# The Walther
pose 25.05 20.80 680.58 -1.583 0.456
wait_seconds 5
lua return soc_say("esc_wpn_walther")
lua_expect soc_ok("esc_wpn_walther")
lua_expect soc_at("esc_wpn_walther", 23.91, 21.92, 680.58)
# From here the first two are far away and offline
lua_expect soc_obj("esc_wpn_pm") == nil and soc_obj("esc_wpn_ak74u") == nil
screenshot soc_weapons_walther

# The first two again, after the actor has been away: they went offline and came back
pose -136.28 -29.69 -357.26 -3.114 0.323
wait_seconds 5
lua_expect soc_ok("esc_wpn_pm")
lua_expect soc_ok("esc_wpn_ak74u")
lua_expect soc_at("esc_wpn_ak74u", -136.22, -28.72, -359.62)
quit
