# The -start command line option: the game goes straight into a new game without the
# main menu. Run it with
#   -ExtraArgs "-start server(all/single/alife/new) client(localhost)"
# Without the option the scenario fails at wait_level (the game stays in the main menu).
# Needs no save.

wait_level 300
wait_seconds 3
ui_expect_no btn_options
screenshot start_option
quit
