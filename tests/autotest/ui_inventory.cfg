# The inventory in a level: starts a new game, opens the inventory with the bound key,
# checks the starting rifle is there, closes it with Escape. Needs no save.

wait_frames 60
start server(all/single/alife/new) client(localhost)
wait_level 300
wait_seconds 3

ui_key inventory
ui_wait 5 class:CUIActorMenu
wait_seconds 1
ui_dump inventory
screenshot inventory
ui_expect item:wpn_ak74u

ui_key kESCAPE
wait_seconds 1
ui_expect_no class:CUIActorMenu
quit
