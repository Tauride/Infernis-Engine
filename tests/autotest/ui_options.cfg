# Opens the options from the main menu with the mouse, as a player would: picks a value in
# a dropdown, switches a tab, cancels; then opens and closes the options with the keyboard.
# Checks the ui_* steps on the real menus. Cancel and Escape undo the changes, and the run
# uses its own autotest.ltx anyway. Needs no save.

wait_frames 60
ui_dump main_menu
ui_expect btn_options

# The main menu buttons select on hover; the highlight then slides over and only
# a click inside it presses the button, so give it time to arrive
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept
ui_expect_no btn_options
wait_frames 30
screenshot options
ui_dump options

# The video tab is open: its controls are found by the console command they are bound to
ui_expect option:rs_screenmode
ui_expect option:rs_c_gamma

# A dropdown: open it, pick a value. While a list is open it captures the mouse:
# a click elsewhere only closes it.
ui_click option:vid_mode
ui_wait 2 option:vid_mode/class:CUIListBox
ui_dump options_vid_mode
ui_click option:vid_mode/class:CUIListBox/text:1024x768
ui_expect_no option:vid_mode/class:CUIListBox
ui_expect option:vid_mode/text:1024x768

# The tab buttons have no names: the n-th visible child of the tab control
ui_click tab/#2
ui_expect_no option:vid_mode
ui_dump options_gameplay
screenshot options_gameplay

# Cancel brings the main menu back
ui_click btn_cancel
ui_wait 5 btn_options
ui_expect_no btn_cancel
screenshot back_to_menu

# The keyboard: Escape closes the options again
ui_move btn_options
wait_seconds 1
ui_click btn_options
ui_wait 5 btn_accept
ui_key ESCAPE
ui_wait 5 btn_options
quit
